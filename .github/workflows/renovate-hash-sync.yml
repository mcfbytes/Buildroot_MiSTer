################################################################################
#
# renovate-hash-sync.yml -- refresh companion tarball/kernel hashes on a
# Renovate PR (TASKS.md P4.6).
#
# Renovate can bump a version/commit pin but cannot recompute a tarball's
# sha256 itself. Every pin this repo tracks has a companion `.hash` file that
# must move in lockstep or Buildroot's own hash check fails the build CLOSED
# (safe, but red and useless without a human redoing the hash by hand). See
# docs/ci.md#renovate-hash-sync-overview.
#
# Six REFRESH cases: (1) the 14 github-sourced package pins, (2) the kernel
# tarball hashes -- TWO pins since 2026-08-17, the stable 6.18.y one and the
# RT/beta 7.2 one, run as two steps over one shared linux.hash, (3) the
# bespoke ip7z/7zip release-asset hashes (lzma-sdk AND
# 7zip -- one step, two packages, same upstream asset), (4) the sdcard
# payload single-file pins, (6) -- numbered after validate-only case 5,
# which predates it -- the Buildroot tarball hash (BUILDROOT_SHA256 in the
# root Makefile), transcribed from buildroot.org's GPG-clearsigned .sign
# manifest, and (7) azcopy's post-`go mod vendor` tarball hash, which is
# REBUILT rather than fetched. Why a locally-computed sha256sum is a
# legitimate source for cases 1/3/4 (not a shortcut), why cases 2 and 6
# transcribe a signed manifest instead, and why case 7 is a third kind
# altogether: docs/ci.md#renovate-hash-sync-safety-model.
#
# Plus one VALIDATE-ONLY case: (5) the _Console cores snapshot pin. It has no
# companion hash to refresh -- but it is also the one pin no PR build ever
# resolves, so nothing else fails closed on a bad bump. See step 5 and
# scripts/hash-sync-cores-pin.sh's header.
#
# NEVER automated: ANY `-rc` kernel hash (no signed manifest exists for a
# cgit snapshot -- hand-written TOFU only),
# cabextract/linux-firmware-extra/xow-firmware. See
# docs/ci.md#renovate-hash-sync-not-automated.
#
# AZCOPY LEFT that list on 2026-08-28, and older commits (plus package/azcopy's
# own file headers before that date) still quote "the hash CANNOT be
# auto-refreshed for a golang-package". What could not be automated was the
# METHOD that sentence was aimed at -- case 1's `curl <archive-url> |
# sha256sum`, which for a golang-package hashes the pre-vendoring tarball and
# produces a plausible-looking WRONG value. That half stands: azcopy must
# never join HASH_SYNC_PACKAGES below. But the artifact itself can be REBUILT
# the way the build builds it -- Buildroot's own support/download/
# go-post-process, its own pinned Go -- and then hashed, which is what case 7
# does. Same source-not-transcriber narrowing cases 2 and 6 went through, one
# step further: case 7 re-derives the artifact rather than fetching it. See
# scripts/hash-sync-azcopy.sh's header.
#
# BUILDROOT_SHA256 LEFT that list on 2026-08-24, and older commits (plus this
# workflow's own commit-message template before that date) still quote
# "BUILDROOT_SHA256 is NEVER automated (signed-manifest-only trust)". The
# prohibition was always about the SOURCE, not the transcriber: hashing a
# downloaded tarball is circular and remains permanently forbidden, but the
# GPG-signed .sign manifest that `make buildroot-showsig` prints for a human
# to transcribe is exactly transcribable by a script too -- the same
# narrowing case 2 went through on 2026-08-17 when the RT pin left the -rc
# series. See scripts/hash-sync-buildroot.sh's header.
#
# The `-rc` entry itself NARROWED earlier, on 2026-08-17 (it was the list's
# second entry then, behind BUILDROOT_SHA256), and the old wording is still
# quoted in older commits: it used to read "the RT beta's TOFU-pinned `-rc`
# kernel hash", naming a PIN. The prohibition was always really about the
# ARTIFACT KIND. The RT pin left the -rc series when Linux 7.2 released, its
# tarball became an ordinary signed-manifest release, and case 2 now refreshes
# it -- while still refusing an -rc for either pin.
#
# TRIGGER: automatically, only for same-repo Renovate PRs touching a file this
# workflow knows how to fix; idempotent (recomputes every run, commits only on
# a real diff). Manually via workflow_dispatch -- the only way to re-drive
# this workflow after a bug in it is fixed. See
# docs/ci.md#renovate-hash-sync-overview and
# docs/ci.md#renovate-hash-sync-dispatch-trap (run 29669946883).
#
# STATUS: only the kernel step is proven against a real PR (#41). A green run
# elsewhere can mean "silently skipped", not "verified correct" (bug #42). See
# docs/ci.md#renovate-hash-sync-verification-status. Case 6 (buildroot) was
# verified at authoring time (2026-08-24) against local fixtures for all four
# outcomes -- including a live-manifest refresh reproducing PR #116's manual
# hash edit byte-for-byte -- but has not yet run against a real Renovate PR.
#
# Every step below records a per-pin outcome and the job fails if one is
# "failed" or if the whole run did nothing -- see
# docs/ci.md#renovate-hash-sync-outcomes-gate.
#
# NOTE: scripts/hash-sync-{github-packages,kernel,ip7z-src,sdcard-payload,
# cores-pin,buildroot,azcopy}.sh + scripts/lib/hash-sync-common.sh are the
# seven cases below -- each step
# just invokes its script (see the second checkout, below, for where the
# scripts come from). Fix bugs IN THE SCRIPTS; this file only wires them up
# and owns the per-pin outcome ledger / push-gate / job-summary steps that
# read what the scripts emit. Each script's own header still carries the
# case-specific rationale (the `|| true` traps, the major-series-scoped
# linux.hash match, etc.) -- read it before touching that case's logic.
#
################################################################################

name: Renovate hash sync

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      # The root Makefile carries the Buildroot pin (BUILDROOT_VERSION /
      # BUILDROOT_SHA256) that case 6 refreshes. ADDED 2026-08-24, when that
      # case was added -- before that a Buildroot bump PR deliberately stayed
      # red until a human transcribed the signed hash (see the header). Same
      # both-lists-or-silent-failure note as rtl8852cu-morrownr below: absent
      # here, the workflow never runs on a Buildroot bump at all -- no skipped
      # job, no red X, no outcome row.
      - "Makefile"
      - "configs/mister_de10nano_defconfig"
      # mister_kernel_defconfig copies this stanza's kernel version (one Renovate
      # PR bumps both).
      - "configs/mister_kernel_defconfig"
      # The RT/beta kernel pin. ADDED 2026-08-17: this file used to be
      # deliberately ABSENT here, because while that pin tracked mainline -rc
      # its hash could not be auto-refreshed at all (no signed manifest exists
      # for a cgit snapshot). Linux 7.2 released, the pin moved onto the 7.2
      # line, and its tarball is now covered by kernel.org's signed manifest
      # like any other release -- so step 2's `--pin=rt` invocation can do the
      # work and this path has to let the event through for it to run.
      # Same both-lists-or-silent-failure note as rtl8852cu-morrownr below: a
      # missing path filter means no skipped job, no red X, no outcome row --
      # the workflow simply never runs and nobody is told the hash is stale.
      # See docs/ci.md#renovate-hash-sync-not-automated.
      - "configs/mister_rt.fragment"
      - "package/rtl8812au/rtl8812au.mk"
      - "package/rtl8814au-morrownr/rtl8814au-morrownr.mk"
      - "package/rtl8821au-morrownr/rtl8821au-morrownr.mk"
      - "package/rtl8821cu-morrownr/rtl8821cu-morrownr.mk"
      - "package/rtl8188fu/rtl8188fu.mk"
      - "package/rtl8188eu-aircrack-ng/rtl8188eu-aircrack-ng.mk"
      - "package/rtl88x2bu/rtl88x2bu.mk"
      # v10.2: the one out-of-tree WiFi driver the image actually ships
      # (ADR 0016). This list is a second, independent allow-list from
      # HASH_SYNC_PACKAGES below and BOTH must name a package: missing here,
      # the pull_request event is filtered out and this workflow never runs at
      # all on the bump PR -- no skipped job, no red X, no outcome row, just a
      # stale hash nobody was told about.
      - "package/rtl8852cu-morrownr/rtl8852cu-morrownr.mk"
      - "package/xone/xone.mk"
      - "package/midilink/midilink.mk"
      # ADR 0023: 7-Zip, which pins the SAME ip7z/7zip release asset
      # package/lzma-sdk does. Renovate raises ONE PR touching both .mk files
      # (shared depName "ip7z/7zip"), and step 3 refreshes both .hash files --
      # but only if this path filter lets the event through. Same silent-failure
      # note as rtl8852cu-morrownr above applies.
      - "package/7zip/7zip.mk"
      - "package/munt/munt.mk"
      - "package/bcm20702-firmware/bcm20702-firmware.mk"
      - "package/libchdr/libchdr.mk"
      - "package/lzma-sdk/lzma-sdk.mk"
      # azcopy (case 7). ADDED 2026-08-28, when that case was added -- before
      # that an azcopy bump PR deliberately stayed red until a human ran
      # package/azcopy/azcopy.hash's regeneration recipe by hand. Same
      # both-lists-or-silent-failure note as rtl8852cu-morrownr above, with a
      # twist: azcopy must appear HERE but must NEVER appear in
      # HASH_SYNC_PACKAGES below (case 1's curl-and-hash method would write a
      # confidently wrong value for a golang-package -- see the header).
      - "package/azcopy/azcopy.mk"
      # dualsensectl (DualSense operator CLI). Ordinary github tag-archive pin,
      # covered by the generic loop in step 1. Same both-lists-or-silent-failure
      # note as rtl8852cu-morrownr above: it must appear HERE and in
      # HASH_SYNC_PACKAGES below.
      - "package/dualsensectl/dualsensectl.mk"
      # ltunify (Logitech Unifying pairing CLI). Ordinary github archive pin --
      # a commit SHA rather than a tag, which the generic loop in step 1 is
      # indifferent to. Same both-lists-or-silent-failure note as above.
      #
      # Expected to be INERT: upstream's last commit is 2020-06-14, so this
      # should never fire. That is not a reason to leave it out -- an entry that
      # never fires costs nothing, and the alternative is a pin with no
      # refresh path on the day the repository does wake up.
      - "package/ltunify/ltunify.mk"
      - "scripts/fetch-sdcard-payload.sh"

  # Manual escape hatch -- nothing else can re-drive this workflow after a fix
  # lands (run 29669946883). `branch` is the branch to FIX, NOT the ref you're
  # dispatching from. See docs/ci.md#renovate-hash-sync-dispatch-trap.
  workflow_dispatch:
    inputs:
      branch:
        description: "Plain branch name to refresh companion hashes on (e.g. renovate/kernel-longterm-6.18-6.x). NOT the branch you are dispatching from, and NOT a ref -- refs/heads/x and heads/x are rejected."
        required: true
        type: string

concurrency:
  # pull_request runs key on the PR number; dispatch runs key on the target
  # branch. Without the fallback every manual run would share one empty-suffix
  # group and cancel the previous one.
  group: renovate-hash-sync-${{ github.event.pull_request.number || inputs.branch }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  hash-sync:
    name: Refresh companion hashes for this branch's version bump(s)
    runs-on: ubuntu-26.04
    # Automatic runs: only Renovate's own PRs, and never a fork (pushing back
    # needs write access to the head branch, which a fork PR's default token
    # never has). Manual runs: workflow_dispatch is already restricted to
    # collaborators with write access, which is the same bar this gate enforces
    # for the automatic path -- so it does not widen who can drive this.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'renovate[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # RAISED 10 -> 20 on 2026-08-28, with case 7. Every other case is a fetch
    # and a hash and the whole job used to finish in about a minute, which 10
    # covered several times over. Case 7 REBUILDS azcopy's vendored tarball
    # (Buildroot unpack + a ~67 MB Go toolchain + ~1.7 GiB of modules) and
    # takes 5-8 minutes on its own when it fires -- close enough to 10 that a
    # slow runner would time the job out and silently lose every other case's
    # refresh along with it. This is a CEILING, not a duration: it only fires
    # on an actual AZCOPY_VERSION bump (case 7 returns `already-current` in
    # seconds otherwise), so raising it costs no Actions minutes on any other
    # PR.
    timeout-minutes: 20

    # Resolved once, as a shell var (not an inline expression), to avoid a
    # script-injection vector via github.event.pull_request.head.ref -- a
    # branch name is attacker-controlled text on a PR. See
    # docs/ci.md#branch-name-injection.
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.head.ref }}

      # Bare filename (not a full path): the `runner` context isn't available
      # in a job-level env: block -- every step below prefixes it with
      # $RUNNER_TEMP instead. Scoped by run_id/run_attempt so an earlier abort
      # can't leak a stale run's outcomes into this run's summary. See
      # docs/ci.md#renovate-hash-sync-outcomes-gate.
      HASH_SYNC_OUTCOMES_FILE: hash-sync-outcomes-${{ github.run_id }}-${{ github.run_attempt }}.tsv

      # Single source of truth for the 14 github-sourced package pins -- shared
      # by step 1's loop and the job-summary gate's pin roster so they can't
      # drift apart. See docs/ci.md#renovate-hash-sync-outcomes-gate.
      #
      # This is an explicit ALLOW-LIST, not auto-discovery:
      # scripts/hash-sync-github-packages.sh iterates over exactly this string
      # and never scans package/*/*.mk, so a package left out is skipped with
      # no outcome row at all -- its Renovate PR would bump <PKG>_VERSION and
      # leave the OLD tarball's sha256 in the .hash, and the build then fails
      # with a Buildroot hash mismatch that reads like a tampered upstream
      # commit rather than missing CI wiring. Adding an entry here is not
      # enough on its own: the same .mk must also appear in the `paths:`
      # trigger above or the workflow never fires.
      #
      # rtl8852cu-morrownr (v10.2) fits the generic loop with no bespoke step:
      # $(call github,morrownr,rtl8852cu-20251113,$(VERSION)) and a cached
      # tarball named dl/rtl8852cu-morrownr/rtl8852cu-morrownr-<sha>.tar.gz,
      # i.e. the <package-dir>-<VERSION>.tar.gz shape the loop assumes.
      #
      # azcopy is the one package that has a refresh case (7) and must still
      # NEVER appear in this string. It is a golang-package: the file Buildroot
      # hashes is the post-`go mod vendor` -go2 tarball, and this loop's
      # `curl <archive-url> | sha256sum` would hash the pre-vendoring archive
      # instead -- a value that looks right, passes review, and fails the build
      # on master. Case 7's own step handles it.
      #
      # dualsensectl fits the same generic loop, and is the first entry pinned
      # to a "v"-prefixed TAG rather than a bare commit SHA or munt's bespoke
      # tag scheme. That works because the "v" is carried inside
      # DUALSENSECTL_VERSION itself: the loop uses the literal *_VERSION value
      # as both the archive ref and the <package-dir>-<VERSION>.tar.gz filename,
      # so .../archive/v0.7.tar.gz and dualsensectl-v0.7.tar.gz both fall out of
      # the same string. Checked at pin time that GitHub serves byte-identical
      # tarballs from the loop's .../archive/<ref>.tar.gz form and Buildroot's
      # .../archive/<ref>/<name>.tar.gz form -- see package/dualsensectl/
      # dualsensectl.hash.
      HASH_SYNC_PACKAGES: "rtl8812au rtl8814au-morrownr rtl8821au-morrownr rtl8821cu-morrownr rtl8188fu rtl8188eu-aircrack-ng rtl88x2bu rtl8852cu-morrownr xone midilink munt bcm20702-firmware libchdr dualsensectl ltunify"

    steps:
      # A manual run pushes commits to whatever branch it is pointed at, so
      # refuse the default branch outright: that would land an auto-generated
      # hash commit on master with no review. The automatic path cannot hit
      # this (a PR head branch is never the base), but a mistyped input can.
      - name: Validate the target branch, and refuse the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "$TARGET_BRANCH" ]; then
            echo "::error::target branch resolved to empty -- nothing to check out." >&2
            exit 1
          fi

          # Syntactic validation first: rejects empty, embedded spaces, "..",
          # a leading "-", and the other things git considers malformed. Runs
          # before checkout, which is fine -- check-ref-format needs no repo.
          if ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "::error::'$TARGET_BRANCH' is not a valid git branch name." >&2
            exit 1
          fi

          # REJECT ref-namespace forms rather than normalise: refs/heads/x and
          # heads/x both resolve to the same branch as x (verified with
          # `git push --dry-run`), which would bypass the compare below. See
          # docs/ci.md#renovate-hash-sync-branch-validation.
          case "$TARGET_BRANCH" in
            refs/*|heads/*|remotes/*|tags/*)
              echo "::error::pass a plain branch name, not a ref: '$TARGET_BRANCH'." >&2
              echo "::error::git resolves refs/heads/<x> and heads/<x> to the same branch as <x>, which would slip past the default-branch check below." >&2
              exit 1
              ;;
          esac

          if [ "$TARGET_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::refusing to run against the default branch ('$TARGET_BRANCH') -- this workflow commits and pushes hash fixes, which must go through a PR." >&2
            exit 1
          fi

          echo "target branch: $TARGET_BRANCH"

      # Same actions/checkout pin as every workflow in this repo -- kept in
      # sync so Renovate's github-actions manager tracks ONE dependency. See
      # docs/ci.md#pin-conventions.
      - name: Checkout the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head branch, or the dispatch input -- NOT the ref this
          # workflow definition came from. On a manual run those differ by
          # design (see docs/ci.md#renovate-hash-sync-dispatch-trap).
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      # A SECOND checkout -- of the hash-sync scripts only, at the ref THIS
      # workflow definition itself runs from, deliberately NOT the target
      # branch checked out above. Why this has to be a second checkout and
      # not just `scripts/hash-sync-*.sh` from the tree above: a kernel-bump
      # PR (or any branch) that predates this extraction does not have these
      # scripts at all, so invoking them out of the target-branch checkout
      # would exit 127 there -- and the workflow_dispatch escape hatch's
      # entire purpose (see docs/ci.md#renovate-hash-sync-dispatch-trap) is to
      # run a FIXED copy of this logic against a stale branch, which sourcing
      # the scripts from that same stale branch would defeat outright.
      # `path:` checks this out into its own subdirectory so it cannot
      # clobber the target-branch working tree checked out above.
      - name: Checkout hash-sync scripts at the workflow's own ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .hash-sync-tools
          fetch-depth: 1

      # --- 1. Github-sourced packages (drivers/firmware + libchdr) -----------
      # Generic loop over the shared Buildroot `$(call github,...)` archive
      # naming convention (verified against every existing .hash file in this
      # tree). Only the FIRST sha256 line is ever rewritten -- a further line
      # legitimately changing fails the build closed for a human to re-derive.
      # See docs/ci.md#companion-hash-first-line-only.
      #
      # Runs from the SECOND checkout (.hash-sync-tools, at this workflow's
      # own ref), against the TARGET branch's tree ($GITHUB_WORKSPACE, the
      # first checkout) -- see that checkout step's comment for why. This is
      # also the step that creates/truncates the shared outcomes file for the
      # run (scripts/hash-sync-github-packages.sh's own header); the other
      # three cases append to it. HASH_SYNC_PACKAGES and
      # HASH_SYNC_OUTCOMES_FILE come from the job-level env: block above;
      # GITHUB_ENV/RUNNER_TEMP are supplied by Actions itself. See
      # docs/ci.md#renovate-hash-sync-outcomes-gate.
      - name: Refresh github-sourced package tarball hashes
        run: .hash-sync-tools/scripts/hash-sync-github-packages.sh "$GITHUB_WORKSPACE"

      # --- 2. Kernel tarball hashes (TWO pins, two steps) ---------------------
      # Only touches board/mister/de10nano/patches/linux/linux.hash's own
      # sha256 data lines; the header comment blocks are preserved verbatim by
      # only ever replacing the matched "sha256" line. Runs from the
      # .hash-sync-tools checkout (this workflow's own ref) against the target
      # branch's tree; see step 1's comment and
      # docs/ci.md#renovate-hash-sync-dispatch-trap for why -- this is the
      # case bug #42 and run 29669946883 both came from, so running a stale
      # copy of THIS script against a branch that needs the fix is exactly
      # the failure this second checkout exists to prevent.
      #
      # TWO STEPS, ONE SCRIPT, ONE SHARED linux.hash. Both pins live in that
      # one file and each step rewrites only its own pin's line -- the script
      # scopes its match to the pin's MAJOR series (6.x vs 7.x), which is what
      # makes running both against one file safe. Each step records its own
      # outcome row ("kernel" / "kernel-rt") and sets its OWN changed-flag
      # variable; see the push gate below, and the CHANGED_VAR note in the
      # script for why sharing one variable would silently suppress a push.
      #
      # Always run BOTH, even though a Renovate PR only ever moves one of them:
      # the other reports `already-current` in about a second, and a
      # conditional here would be one more thing to get wrong on the dispatch
      # path (where no PR payload says which pin moved).
      - name: Refresh stable kernel tarball hash from kernel.org's signed manifest
        run: .hash-sync-tools/scripts/hash-sync-kernel.sh --pin=stable "$GITHUB_WORKSPACE"

      # NEW 2026-08-17, when Linux 7.2 released and the RT/beta pin crossed the
      # -rc boundary. It was NOT automatable before that and the reason was
      # never "nobody got round to it": an -rc is fetched as a cgit snapshot
      # that kernel.org signs no manifest for, so its hash could only ever be
      # hand-written TOFU. On the 7.2 line the artifact is an ordinary
      # linux-7.2.tar.xz covered by the signed sha256sums.asc -- same source,
      # same trust level as the stable pin above. The script still REFUSES any
      # -rc for either pin, so if this pin is ever hand-pointed back at one,
      # this step records `skipped` and the build fails closed instead.
      # See docs/ci.md#renovate-hash-sync-not-automated.
      - name: Refresh RT/beta kernel tarball hash from kernel.org's signed manifest
        run: .hash-sync-tools/scripts/hash-sync-kernel.sh --pin=rt "$GITHUB_WORKSPACE"

      # --- 3. ip7z/7zip release-asset tarball hashes --------------------------
      # Bespoke, NOT part of step 1's generic loop: these tarballs are release
      # ASSETS, not commit/tag archives, and the filename derives from the
      # version with the dots stripped (26.02 -> 7z2602-src.tar.xz). Only the
      # FIRST sha256 line of each .hash is rewritten. See
      # docs/ci.md#companion-hash-first-line-only. Runs from the
      # .hash-sync-tools checkout against the target branch's tree; see step
      # 1's comment.
      #
      # TWO packages now, not one (ADR 0023): package/lzma-sdk (liblzma-sdk.so
      # from the archive's C/ dir) and package/7zip (the 7zz application + the
      # static /media/fat/linux/7za). The script is table-driven over both and
      # sets LZMA_SDK_HASH_CHANGED and SEVENZIP_HASH_CHANGED -- the latter is
      # spelled out rather than "7ZIP_..." because an env var cannot start with
      # a digit. Renamed from hash-sync-lzma-sdk.sh 2026-07-27 for the same
      # reason the step title changed: it is no longer one package's case.
      - name: Refresh ip7z/7zip release-asset tarball hashes (lzma-sdk, 7zip)
        run: .hash-sync-tools/scripts/hash-sync-ip7z-src.sh "$GITHUB_WORKSPACE"

      # --- 4. SD-card payload single-file pins -------------------------------
      # Pins update_all.sh + wifi.sh only, by commit AND sha256+size;
      # PINNED_CORES_COMMIT has no companion hash and is deliberately not
      # handled here. See docs/ci.md#renovate-hash-sync-not-automated. Runs
      # from the .hash-sync-tools checkout against the target branch's tree;
      # see step 1's comment.
      - name: Refresh sdcard payload script hashes (update_all.sh, wifi.sh)
        run: .hash-sync-tools/scripts/hash-sync-sdcard-payload.sh "$GITHUB_WORKSPACE"

      # --- 5. _Console cores snapshot pin: VALIDATE, never rewrite -----------
      # The odd one out: PINNED_CORES_COMMIT has no companion hash, so there
      # is nothing to refresh -- but it is also read NOWHERE in PR CI (only
      # release.yml's opt-in SDCARD_CORES=1 leg resolves it), so a Renovate
      # bump to a commit that no longer resolves, lists no cores, or blows the
      # ~600 MiB cap would go unnoticed until a release is cut. One Contents
      # API call closes that. This step edits no file and its CORES_PIN_CHANGED
      # is always 0, so it is deliberately ABSENT from the commit/push `if:`
      # below -- but a "failed" outcome from it still suppresses that push and
      # fails the job, via the same outcomes ledger as the other four. Runs
      # from the .hash-sync-tools checkout against the target branch's tree;
      # see step 1's comment. GITHUB_TOKEN is passed because the
      # unauthenticated API limit (60/hr per runner IP) would otherwise turn
      # this check into a 403 -> "skipped" that validates nothing.
      - name: Validate the _Console cores snapshot pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .hash-sync-tools/scripts/hash-sync-cores-pin.sh "$GITHUB_WORKSPACE"

      # --- 6. Buildroot tarball hash (BUILDROOT_SHA256, root Makefile) --------
      # NEW 2026-08-24. Transcribed from buildroot.org's GPG-clearsigned
      # release manifest (buildroot-<ver>.tar.gz.sign) -- the SAME signed file
      # `make buildroot-showsig` prints for the manual transcription this step
      # replaces, and the same trust model as case 2's kernel.org manifest.
      # The script never downloads the tarball, never computes a sha256 of
      # one, and edits ONLY the hash value on the Makefile's BUILDROOT_SHA256
      # line (stanza alignment preserved byte-for-byte -- that stanza is
      # Renovate-watched). See the header above for why the old "NEVER
      # automated" entry narrowed, and the script's own header for the full
      # rationale. Runs from the .hash-sync-tools checkout against the target
      # branch's tree; see step 1's comment.
      - name: Refresh the Buildroot tarball hash from buildroot.org's signed manifest
        run: .hash-sync-tools/scripts/hash-sync-buildroot.sh "$GITHUB_WORKSPACE"

      # --- 7. azcopy's post-`go mod vendor` tarball hash ----------------------
      # NEW 2026-08-28. The one case that REBUILDS its artifact instead of
      # fetching it. azcopy is a golang-package, so the file Buildroot hashes
      # is azcopy-<ver>-go2.tar.gz -- the GitHub archive with `go mod vendor`
      # run inside it and the tree deterministically repacked -- and no URL
      # anywhere serves that file. Case 1's method cannot produce it and azcopy
      # must stay out of HASH_SYNC_PACKAGES; see the header for why that half
      # of the old "cannot be automated" claim is permanent while the other
      # half was not.
      #
      # The script runs BUILDROOT'S OWN support/download/go-post-process from
      # the pinned (BUILDROOT_SHA256-verified) tree, with the Go version that
      # tree pins, verified against that tree's own package/go/go.hash -- so
      # nothing about the reproduction is re-implemented or hard-coded here,
      # and a Buildroot bump moves it in lockstep. It also refreshes the
      # LICENSE/NOTICE.txt lines, which no build ever checks (only `make
      # legal-info` reads them) and which the manual recipe therefore had as a
      # separate by-hand step.
      #
      # EXPENSIVE by this family's standards -- it unpacks Buildroot,
      # downloads a ~67 MB Go toolchain and vendors ~1.7 GiB of modules, so
      # 5-8 minutes rather than case 1's seconds. That cost is why the
      # `paths:` filter above matters more here than anywhere else: this step
      # returns `already-current` in seconds when azcopy.hash already pins the
      # current AZCOPY_VERSION -- which is what EVERY non-azcopy bump PR sees,
      # since `paths:` fires this workflow for any pin, not just this one. The
      # expensive path is reached only by an actual AZCOPY_VERSION bump. That
      # ordering (cheap check first, scratch dir and downloads after) is
      # load-bearing for this job's Actions-minutes budget; do not move it.
      # It is also why the job timeout went 10 -> 20 -- see its comment above.
      #
      # Runs from the .hash-sync-tools checkout against the target branch's
      # tree; see step 1's comment.
      - name: Rebuild and refresh the azcopy vendored-tarball hash
        run: .hash-sync-tools/scripts/hash-sync-azcopy.sh "$GITHUB_WORKSPACE"

      # Gate the push: ANY pin recorded "failed" (from any of the steps
      # above) suppresses the commit/push below. MUST run and be evaluated
      # BEFORE the push -- the summary/gate step at the end of the job
      # deliberately runs LAST, which is exactly wrong for this check. See
      # docs/ci.md#renovate-hash-sync-outcomes-gate.
      - name: Check for a recorded workflow bug before pushing anything
        run: |
          set -euo pipefail
          # Resolved to a full path per-step; see
          # docs/ci.md#renovate-hash-sync-outcomes-gate.
          outcomes_file="$RUNNER_TEMP/$HASH_SYNC_OUTCOMES_FILE"
          touch "$outcomes_file"
          n_failed=$(awk -F'\t' '$2 == "failed" { c++ } END { print c+0 }' "$outcomes_file")
          echo "HASH_SYNC_FAILED=$n_failed" >> "$GITHUB_ENV"
          if [ "$n_failed" -gt 0 ]; then
            echo "::warning::$n_failed pin(s) recorded a 'failed' (workflow-bug) outcome this run -- suppressing the commit/push step below even though another pin's hash may have refreshed. The job summary step still fails the run; re-dispatch after the bug is fixed to pick up the suppressed refresh(es)."
          fi

      - name: Commit and push hash refresh, if anything changed
        if: >
          (env.PKG_HASH_CHANGED == '1' || env.PATCH_HASH_CHANGED == '1' ||
           env.RT_PATCH_HASH_CHANGED == '1' ||
           env.LZMA_SDK_HASH_CHANGED == '1' || env.SEVENZIP_HASH_CHANGED == '1' ||
           env.PAYLOAD_HASH_CHANGED == '1' || env.BUILDROOT_HASH_CHANGED == '1' ||
           env.AZCOPY_HASH_CHANGED == '1') &&
          env.HASH_SYNC_FAILED == '0'
        run: |
          set -euo pipefail
          git config user.name "renovate-hash-sync[bot]"
          git config user.email "renovate-hash-sync@users.noreply.github.com"
          git add Makefile package/*/*.hash board/mister/de10nano/patches/linux/linux.hash scripts/fetch-sdcard-payload.sh
          git commit -F - <<'COMMITMSG'
          renovate-hash-sync: refresh companion hash(es) for this PR

          Recomputed from a freshly-fetched artifact:
            - driver/firmware/libchdr package pins: sha256sum of the github
              archive tarball at the new pinned owner/repo/ref (same "locally
              computed" practice this tree's own .hash file headers already
              document)
            - kernel pins (stable 6.18.y and the RT/beta 7.2 line): kernel.org's
              signed sha256sums.asc for each pin's own vN.x series. An -rc is
              never refreshed here -- no signed manifest exists for one
            - lzma-sdk pin: sha256sum of the ip7z/7zip release ASSET for the
              new version (upstream publishes no checksums at all -- see
              package/lzma-sdk/lzma-sdk.hash's header)
            - sdcard payload pins (update_all.sh, wifi.sh): sha256 + size of
              the raw file at the new pinned commit, rewritten in place in
              scripts/fetch-sdcard-payload.sh
            - Buildroot pin (BUILDROOT_SHA256, root Makefile): transcribed
              from buildroot.org's GPG-signed release manifest
              (buildroot-<ver>.tar.gz.sign) -- the same signed file `make
              buildroot-showsig` prints, never a locally-computed sha256sum
              of the tarball (that remains forbidden; see the Makefile's own
              header comment)
            - azcopy pin: REBUILT, not fetched. Buildroot's own
              support/download/go-post-process re-ran `go mod vendor` over the
              newly pinned tag with the Go version the pinned Buildroot tree
              pins, and the resulting azcopy-<ver>-go2.tar.gz was hashed --
              the only way this value can be derived, since no URL serves that
              file (see package/azcopy/azcopy.hash's header). LICENSE and
              NOTICE.txt were re-hashed from the same tarball
          COMMITMSG
          # Shell variable, NOT a workflow-expression interpolation --
          # TARGET_BRANCH is attacker-controlled text on a PR (command-injection
          # vector otherwise). See docs/ci.md#branch-name-injection.
          # "--" stops a branch named like an option from being parsed as one.
          git push origin -- "HEAD:$TARGET_BRANCH"

      # --- Job summary + pass/fail gate over every pin's outcome -------------
      # `if: !cancelled()`, NOT `always()`: this table must survive an
      # unanticipated abort, but must NOT fire "workflow bug" errors when
      # GitHub's own cancel-in-progress cancels a superseded run -- that would
      # train readers to distrust the table. See
      # docs/ci.md#renovate-hash-sync-outcomes-gate.
      - name: Build job summary and fail on a bug or an all-skipped run
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Resolved to a full path per-step; see
          # docs/ci.md#renovate-hash-sync-outcomes-gate.
          outcomes_file="$RUNNER_TEMP/$HASH_SYNC_OUTCOMES_FILE"
          touch "$outcomes_file"

          # Every pin this workflow owns, in step order; cross-checked below so
          # an unhandled `set -e` abort mid-loop can't make a pin silently
          # vanish from this summary -- exactly how run 29669946883 went
          # unnoticed. See docs/ci.md#renovate-hash-sync-outcomes-gate.
          # `kernel-rt` joined the ledger on 2026-08-17 with case 2's second
          # pin. It MUST be listed: a pin absent from this string is not
          # cross-checked, so its step could stop recording anything at all and
          # the summary would look complete -- the precise shape of run
          # 29669946883.
          #
          # `7zip` and `buildroot` joined on 2026-08-24. `7zip` was an
          # OVERSIGHT being fixed, not a new pin: case 3 has recorded a "7zip"
          # row since ADR 0023 made it table-driven over both ip7z packages,
          # but only "lzma-sdk" was ever listed here -- so a case-3 abort
          # between the two packages would have made the 7zip row vanish from
          # this summary without a trace, the exact failure this cross-check
          # exists to catch. `buildroot` is case 6's row.
          #
          # `azcopy` joined on 2026-08-28 with case 7. It is deliberately NOT
          # in $HASH_SYNC_PACKAGES (that string is case 1's curl-and-hash
          # roster, which must never touch a golang-package) and so has to be
          # named here separately, exactly like the four pins before it.
          all_pins="$HASH_SYNC_PACKAGES kernel kernel-rt lzma-sdk 7zip buildroot azcopy PINNED_UPDATE_ALL PINNED_WIFI_SH PINNED_CORES"

          complete_file=$(mktemp)
          cp "$outcomes_file" "$complete_file"
          for pin in $all_pins; do
            if ! awk -F'\t' -v p="$pin" '$1 == p { found=1 } END { exit !found }' "$outcomes_file"; then
              # "not-run" != "failed": no outcome recorded means the pin's own
              # step never reached it, not proof of a parse bug -- still
              # counts toward the fail gate, just not the "workflow bug"
              # message. See docs/ci.md#renovate-hash-sync-outcomes-gate.
              printf '%s\t%s\t%s\n' "$pin" not-run \
                "no outcome recorded -- its step exited before reaching this pin (check the step logs above)" \
                >> "$complete_file"
            fi
          done

          {
            echo "## Renovate hash-sync outcomes"
            echo
            echo "A skip or failure here means a companion \`.hash\` (or the sdcard"
            echo "payload script) was NOT refreshed for this PR. That is only safe"
            echo "because Buildroot's own hash check fails the BUILD closed on a stale"
            echo "hash -- it is never silently accepted -- but a skip should still be"
            echo "investigated, not just left for the build to catch."
            echo
            echo "| Pin | Outcome | Reason |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r pin outcome reason; do
              # Escape any literal pipe in a reason so it can't break the table.
              reason=${reason//|/\\|}
              echo "| \`$pin\` | $outcome | $reason |"
            done < "$complete_file"
          } >> "$GITHUB_STEP_SUMMARY"

          n_failed=$(awk -F'\t' '$2 == "failed" { c++ } END { print c+0 }' "$complete_file")
          n_notrun=$(awk -F'\t' '$2 == "not-run" { c++ } END { print c+0 }' "$complete_file")
          n_refreshed=$(awk -F'\t' '$2 == "refreshed" { c++ } END { print c+0 }' "$complete_file")
          n_current=$(awk -F'\t' '$2 == "already-current" { c++ } END { print c+0 }' "$complete_file")
          n_skipped=$(awk -F'\t' '$2 == "skipped" { c++ } END { print c+0 }' "$complete_file")
          echo "totals: refreshed=$n_refreshed already-current=$n_current skipped=$n_skipped not-run=$n_notrun failed=$n_failed"

          fail=0

          # Case 1: a genuine bug (a parse/extract failure against a file
          # THIS repo controls, or an unresolvable ambiguity in linux.hash).
          # These are never legitimate to wave through.
          if [ "$n_failed" -gt 0 ]; then
            echo "::error::$n_failed pin(s) failed (a workflow bug, not an upstream network condition) -- see the job summary table." >&2
            fail=1
          fi

          # Case 1b: "not-run" pins -- same "never vanish silently" reasoning
          # as above. See docs/ci.md#renovate-hash-sync-outcomes-gate.
          if [ "$n_notrun" -gt 0 ]; then
            echo "::error::$n_notrun pin(s) never ran -- an earlier step aborted before reaching them -- see the job summary table." >&2
            fail=1
          fi

          # Case 2: run-29669946883 signature -- EVERY pin skipped/not-run/
          # failed, nothing refreshed/current. A single pin's network blip is
          # fine; the WHOLE run doing nothing is not. See
          # docs/ci.md#renovate-hash-sync-outcomes-gate.
          if [ "$((n_refreshed + n_current))" -eq 0 ]; then
            echo "::error::every tracked pin was skipped, not-run, or failed -- this is the run-29669946883 signature (the job would otherwise report green while doing nothing). See the job summary table." >&2
            fail=1
          fi

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
