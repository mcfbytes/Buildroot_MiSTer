# fork-sync.conf — how far we have reconciled MiSTer-devel/Linux-Kernel_MiSTer.
#
# WHY THIS FILE EXISTS
# --------------------
# This repo is the source of truth for the MiSTer kernel: the patch series in
# board/mister/de10nano/linux-patches/ is what gets built, and scripts/export-kernel-tree.sh
# renders it into the fork's tree format. But the fork is a live repo that other people
# commit to. Anything landing there after our last reconciliation is, by definition,
# something this repo does not have and nobody has decided about.
#
# Left to humans that decision never gets made -- not through neglect, but because there
# is no moment that forces the question. The fork sat on 5.15.1 for 210 stable releases
# for exactly this reason: nothing ever said "these N commits are unaccounted for".
#
# So this file records the last commit on each fork branch whose content has a disposition
# in docs/patch-provenance.md, and scripts/check-fork-sync.sh diffs it against the fork's
# live HEADs. .github/workflows/fork-sync.yml runs that weekly and opens an issue when the
# answer is non-empty. The queue is then a fact rather than a memory.
#
# FORMAT
#   <branch>  <full-40-char-sha>
# Comments and blank lines ignored. Full SHAs only -- an abbreviation that is unambiguous
# today can collide later, and this is compared, not just displayed.
#
# UPDATING
# Move a line ONLY when the commits it skips past have been dispositioned -- a structured
# record at docs/kernel-recon/records/<full-sha>.json (the CURRENT mechanism, and the one to
# use) or, for the pre-2026-07 campaign, a row in docs/patch-provenance.md -- carried into the
# series, or recorded as deliberately dropped with a reason. Advancing it to silence the issue
# is the one thing that breaks this: the file stops meaning "reconciled" and starts meaning
# "seen", which is what it exists to prevent. A comment in THIS file is not a disposition
# either; 794e6f002 was advanced past that way on 2026-07-16 and had to be retrofitted with a
# real record on 2026-07-24.
#
# "Dispositioned" also does not mean "closed". A record may disposition a commit and still
# carry an open recommendation -- see the MiSTer-v6.18 note below.
#
# WHY BOTH BRANCHES -- and which one is "stock" (inverted on 2026-09-07)
#   MiSTer-v5.15 -- the branch stock SHIPPED from 2021-11 until 2026-09-07, and the
#     baseline the whole original reconciliation was performed against
#     (docs/patch-provenance.md's header names f0fb626ac; the pointer below is past that).
#     Frozen at 5fcfae369 since 2026-07-24. Kept listed so a late commit there is still
#     noticed, but it no longer answers "what does stock have".
#   MiSTer-v6.18 -- upstream's own vanilla 6.18.38 base, created 2026-07-16, which our
#     export replays onto (MiSTer-devel/Linux-Kernel_MiSTer#75). SINCE RELEASE 20260907
#     (2026-09-07) THIS IS WHAT EVERY STOCK MiSTer RUNS: the shipped kernel's IKCONFIG
#     config is byte-identical to arch/arm/configs/MiSTer_defconfig at aec7dc3aa
#     (docs/kernel-recon/fork-sync-2026-09/evidence/). So a commit landing here is now a
#     stock-parity question AND a change to our exported series by other people; either way
#     it has to flow back into linux-patches/ (or -upstream/) or the next regeneration
#     silently erases it. That queue -- 9 commits past 6332499e7 plus open PR #92's head --
#     was planned in fork-sync-2026-09/PLAN.md and is now DISPOSITIONED and executed
#     (2026-09-11); the pointer below has been advanced accordingly and the per-item table
#     is further down this file. (This paragraph said "8 commits ... not yet dispositioned"
#     until the Wave-4 audit corrected it on 2026-09-11: PLAN.md was written on 2026-09-10,
#     before c129b0fac landed, and was never updated when Wave 0 asserted the queue at 9.)

