% minijail-config-file v0

# BusyBox syslogd's jail, used by /etc/init.d/S01syslogd through
# /usr/lib/mister/jail.sh. Why each line: docs/minijail.md "syslogd and klogd".

# uid/gid 8424 (users.table); no capabilities at all.
u = 8424
g = 8424
c = 0x0

# Mount, PID, IPC and network namespaces: /dev/log is a path, so it needs no network.
ns-mount
I
l
e

bind-mount = /usr
mount = /dev/null,/dev/null,none,MS_BIND
# The /dev/log socket and the logs; /dev/log and /tmp/messages{,.0} on the host link here.
mount = /run/log,/run/log,none,MS_BIND
mount = /run/log,/run/log,none,MS_BIND|MS_REMOUNT|MS_NOEXEC|MS_NOSUID|MS_NODEV
# Writable by its modes, granted by no Landlock rule: the start's Landlock probe.
mount = tmpfs,/var/empty,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC,mode=1777,size=4k

fs-path-rx = /usr
fs-path-ro = /etc
fs-path-rw = /dev/null
fs-path-advanced-rw = /run/log
