################################################################################
#
# release.yml — tag-triggered release workflow + build provenance (TASKS.md
# P4.4, PLAN.md §9 "Build", docs/downloader-contract.md P0.6).
#
# Builds via the same recipe as build.yml (.github/actions/buildroot-build),
# then assembles a GitHub Release for three downstream consumers: a human
# downloading assets from the Release page, the on-device Downloader_MiSTer
# (which never talks to GitHub Releases directly), and a human opting into
# the PREEMPT_RT beta kernel. See docs/ci.md#release-consumers.
#
# Rebuilds from the tagged commit and re-runs the full non-hardware
# verification suite rather than trusting build.yml's run or artifacts.
# See docs/ci.md#rebuild-not-adopt.
#
# Fetches (never vendors — G6) the stock uboot.img / files/linux/ payload
# from a commit-pinned third-party archive, verified before extraction.
# See docs/ci.md#stock-payload-sourcing, #stock-payload-verification, and
# the open provenance question at #stock-payload-open-decision.
#
# Tag convention (`v*`) is unratified, and the release filename / db.json
# version is deliberately decoupled from the git tag. See
# docs/ci.md#tag-convention and docs/ci.md#mister-version-coupling.
#
################################################################################

name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch builds ONLY the opt-in full sdcard variant (tagged pushes
  # always build the minimal one). MUST be dispatched against a tag ref, not
  # a branch — the publish job is guarded to tag refs regardless, but a
  # branch dispatch still burns a full build for nothing. See
  # docs/ci.md#manual-full-sdcard-dispatch.
  workflow_dispatch:
    inputs:
      build_full_sdcard:
        description: 'Also build + publish sdcard-full.img.xz (bundles _Console cores). Off by default; the minimal sdcard.img.xz is always built.'
        type: boolean
        default: false

# A re-pushed (corrected) tag should supersede an in-flight run for the same
# tag; distinct tags already get distinct concurrency groups via github.ref,
# so this never cancels a run for a DIFFERENT release.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level; the `publish` job elevates its own
# permissions block (contents: write, id-token: write, attestations: write)
# only for the steps that actually need them (attest + create the release).
permissions:
  contents: read

jobs:
  # ============================================================================
  # kernel-variants — derives the kernel-variant matrix from the filesystem
  # registry; build.yml's `gate` job runs the identical script so the two
  # workflows can't drift onto different matrix literals. Fails loudly on
  # zero variants rather than skipping. See docs/ci.md#variants.
  # ============================================================================
  kernel-variants:
    name: Derive kernel-variant matrix
    runs-on: ubuntu-26.04
    outputs:
      kernel_variants: ${{ steps.variants.outputs.kernel_variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive kernel-variant matrix
        id: variants
        run: |
          set -euo pipefail
          json=$(scripts/list-kernel-variants.sh)
          echo "kernel_variants=$json" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # build-kernel — the kernel-variant matrix (ADR 0021 as amended 2026-07-18),
  # run BEFORE `build` because `build` merges each leg's module tree into the
  # one shipped linux.img. Each leg ships the FULL kernel GPL-source bundle,
  # not build.yml's manifest-only SBOM — a release DISTRIBUTES the variant
  # kernel binary, so the source obligation is real. No MISTER_VERSION
  # derivation here: a kernel-only build has no rootfs to bake it into.
  # Adding a variant, and what still needs a hand-edit: docs/ci.md#variants.
  # Matrix design (per-leg artifact contents): docs/ci.md#kernel-variant-matrix.
  # No `container:` — see docs/ci.md#no-container-disk-reclaim.
  # ============================================================================
  build-kernel:
    name: Build kernel (${{ matrix.kernel }})
    needs: kernel-variants
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        kernel: ${{ fromJSON(needs.kernel-variants.outputs.kernel_variants) }}

    # Same estimate as build.yml's build-kernel: cold = cross-toolchain (~1h)
    # + stage-1 initramfs (~30 min) + one kernel build; 240 is ~2x that.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared leg recipe — see .github/actions/kernel-leg. full-legal-info
      # ships the full GPL source bundle (docs/ci.md#kernel-variant-matrix);
      # release-context swaps the summary for release-flavoured wording.
      - name: Build kernel leg (${{ matrix.kernel }})
        uses: ./.github/actions/kernel-leg
        with:
          kernel: ${{ matrix.kernel }}
          full-legal-info: "true"
          release-context: "true"

  # ============================================================================
  # build — produces every release asset and the pinned-7za-verified archive.
  # Runs after the kernel matrix so it can merge each leg's module tree into
  # linux.img. No `container:` — see docs/ci.md#no-container-disk-reclaim.
  # ============================================================================
  build:
    name: Build image + assemble release_YYYYMMDD.7z
    needs: build-kernel
    runs-on: ubuntu-26.04

    # Cold build measured at 3h19m (run 29300460591) plus stock-archive fetch,
    # archive assembly, and the sdcard steps' installer build + kernel relink
    # (the relink REUSES output/, no second from-scratch build — do not
    # reintroduce one; an earlier from-scratch design overran the runner's
    # hard 360-min cap and the release never published). See
    # docs/ci.md#sdcard-timing-6h-cap.
    timeout-minutes: 355

    outputs:
      release_date: ${{ steps.mister_version.outputs.release_date }}

    env:
      DEBIAN_FRONTEND: noninteractive

      # --- Pinned stock reference archive --------------------------------
      # The ONLY source in this pipeline for uboot.img and the files/linux/
      # payload we do not vendor (G6). See docs/ci.md#stock-payload-sourcing.
      STOCK_RELEASE_URL: https://raw.githubusercontent.com/MiSTer-devel/SD-Installer-Win64_MiSTer/b8531c7848526d9a8227841923cc4a493cb6e631/release_20250402.7z
      STOCK_RELEASE_MD5: 8dc3acae7d758a80a363fbd7ad31d95d
      STOCK_RELEASE_SHA256: 5d087d9c501b2bc50aaf918146e7bf30e5981c08268d5a0e67a3233a4da642ba
      STOCK_RELEASE_SIZE: "93727644"
      STOCK_UBOOT_SHA256: e2d46cf9fe1ec40ca2c9c7409870249f267e06f70e5736dc6d30b4e21fe62a64
      STOCK_UBOOT_SIZE: "515141"
      STOCK_UPDATEBOOT_SHA256: 6ff2d50a080e26d7173b61c52083e9cc42ca658db0c5031b4da1c45c74a562f2
      STOCK_UPDATEBOOT_SIZE: "407"

      # --- Pinned ARM 7za (dynamically linked, glibc) -----------------------
      # The exact binary the real on-device Downloader fetches; its upstream
      # URL is an intentionally unpinned floating ref (matches what real
      # devices fetch) — the MD5 check below is the actual security control.
      # See docs/ci.md#stock-payload-sourcing.
      STOCK_7ZA_GZ_URL: https://github.com/MiSTer-devel/SD-Installer-Win64_MiSTer/raw/master/7za.gz
      STOCK_7ZA_GZ_MD5: ed1ad5185fbede55cd7fd506b3c6c699
      STOCK_7ZA_GZ_SIZE: "465600"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # MUST run before the build: post-build.sh reads MISTER_VERSION to bake
      # /MiSTer.version into the image (ADR 0018). Derived from the tagged
      # commit's UTC date, not SOURCE_DATE_EPOCH, so distinct tags produce
      # distinct versions. See docs/ci.md#mister-version-coupling.
      - name: Derive release version (YYMMDD) from the tagged commit
        run: |
          set -eu
          v="${MISTER_VERSION:-$(TZ=UTC git show -s --format=%cd --date=format-local:%y%m%d HEAD)}"
          case "$v" in
            [0-9][0-9][0-9][0-9][0-9][0-9]) : ;;
            *) echo "::error::derived MISTER_VERSION '$v' is not 6 digits YYMMDD" >&2; exit 1 ;;
          esac
          echo "MISTER_VERSION=$v" >> "$GITHUB_ENV"
          echo "Release version (YYMMDD) = $v  ->  /MiSTer.version, release_20${v}.7z, db.json"

      # Populates the extra-modules overlay before the build — see
      # .github/actions/merge-kernel-modules for the mechanism. Also feeds
      # dist/'s per-variant zImage_dtb/config/legal-info assets, staged later
      # in this job.
      - name: Download + populate kernel-variant module overlay
        uses: ./.github/actions/merge-kernel-modules
        with:
          phase: download

      # Shared recipe (disk reclaim, caches, apt, defconfig, `make all`).
      # p7zip-full here is a DIFFERENT 7za than the pinned ARM dynamic one
      # fetched below — this one only creates/inspects the archive on the
      # x86_64 runner. See docs/ci.md#stock-payload-verification.
      - name: Build the image
        uses: ./.github/actions/buildroot-build
        with:
          # extra-apt-packages: p7zip-full assembles release_YYYYMMDD.7z; the
          # rest are host-only tools scripts/mk-sdcard.sh needs (genimage,
          # mtools, dosfstools, xz-utils, jq) — none enter the shipped rootfs.
          # See docs/ci.md#release-apt-packages.
          extra-apt-packages: p7zip-full genimage mtools dosfstools xz-utils jq
          run-legal-info: "true"

      # Assert every kernel-variant module tree merged into the image -- see
      # .github/actions/merge-kernel-modules/action.yml for the silent-overlay-
      # miss guard this runs.
      - name: Assert kernel-variant module trees merged
        uses: ./.github/actions/merge-kernel-modules
        with:
          phase: verify

      # Re-runs build.yml's non-hardware parity suite (ci-tests.sh) and ABI/
      # SONAME checker (check-abi.sh) against THIS EXACT rootfs — the tagged
      # commit may not be one build.yml ever validated. See
      # docs/ci.md#rebuild-not-adopt. skip-qemu-system matches build.yml;
      # see .github/actions/verify-image for the full rationale.
      - name: Run parity suite + ABI/SONAME checker
        uses: ./.github/actions/verify-image
        with:
          skip-qemu-system: "true"

      ##########################################################################
      # Assemble dist/. See docs/ci.md#dist-layout for the asset contract.
      ##########################################################################

      - name: Stage dist/ and copy the two image assets
        run: |
          set -eu
          mkdir -p dist
          cp -f output/images/linux.img dist/linux.img
          cp -f output/images/zImage_dtb dist/zImage_dtb

      - name: Copy buildroot.config and linux.config
        run: |
          set -eu
          # nullglob keeps a zero-match glob's count truthful for the guard
          # below (mirrors .github/actions/kernel-leg's staging step). See
          # docs/ci.md#dist-layout.
          shopt -s nullglob
          cp -f output/.config dist/buildroot.config
          trees=(output/build/linux-[0-9]*/)
          if [ "${#trees[@]}" -ne 1 ] || [ ! -d "${trees[0]}" ]; then
            echo "::error::expected exactly one kernel tree at output/build/linux-[0-9]*/ but found ${#trees[@]} -- cannot stage linux.config (zero: the build produced no kernel tree; more than one: a stale sibling from a version bump, e.g. linux-headers-*/linux-firmware-* are excluded by the glob but another linux-<ver>/ would not be)" >&2
            exit 1
          fi
          cp -f "${trees[0]}.config" dist/linux.config

      # patches-only: ship our applied patches + the SBOM (manifest.csv with
      # each package's pinned upstream URL+hash, license texts, buildroot.config)
      # but NOT the upstream *.tar.* source archives. Each archive is the
      # freely-available, hash-pinned upstream manifest.csv points to and this
      # public repo rebuilds byte-for-byte, so bundling ~1.4 GiB of it into
      # every release (591 MiB of that the linux-firmware blob alone) only
      # duplicated what the repo + upstream already provide and left ~664 MiB
      # under GitHub's 2 GiB per-asset cap as firmware grows each release. The
      # complete corresponding source is this repo at the tag + that referenced
      # upstream; the release notes below carry the GPLv2 written offer.
      # host-sources/ (the build-time toolchain) is dropped in every mode
      # regardless. See docs/ci.md#legal-info-2gib-cap.
      - name: Archive legal-info as legal-info.tar.gz
        run: |
          set -eu
          # shellcheck source=scripts/ci-lib.sh
          source scripts/ci-lib.sh
          if [ ! -d output/legal-info ]; then
            echo "::error::output/legal-info does not exist -- did 'make legal-info' run?" >&2
            exit 1
          fi
          ci_lib_package_legal_info output dist/legal-info.tar.gz patches-only

          # GitHub's hard per-asset ceiling is 2 GiB. Fail here, with a clear
          # message, rather than at the upload.
          ci_lib_check_release_asset_size dist/legal-info.tar.gz legal-info.tar.gz \
            ". The package set has outgrown a single source bundle -- split it (e.g. sources/ as its own asset, or publish sources to a separate host and reference them from manifest.csv)."

      # The per-variant release extras, straight from the leg artifacts (the
      # legs already applied the uniqueness guards and the legal-info size
      # guard). Copied by glob so a future matrix entry needs no edit here;
      # each glob must match at least once — zero matches means the download
      # step above silently changed shape, and cp's own failure catches that.
      - name: Stage kernel-variant assets into dist/
        run: |
          set -eu
          cp -f kernel-artifacts/zImage_dtb-* kernel-artifacts/linux-*.config \
                kernel-artifacts/legal-info-*.tar.gz dist/
          ls -la dist/

      ##########################################################################
      # /MiSTer.version -> RELEASE_DATE. LOAD-BEARING: db.json's linux.version
      # must equal, byte-for-byte, this baked value (docs/downloader-contract.md
      # §3/§12) — see docs/ci.md#mister-version-coupling.
      ##########################################################################
      - name: Extract and validate /MiSTer.version from the built image
        id: mister_version
        run: |
          set -eu
          workdir=$(mktemp -d ./mister-version.XXXXXX)
          debugfs -R "rdump /MiSTer.version ${workdir}" output/images/linux.img >/dev/null 2>"${workdir}.debugfs.log" || true
          verfile="${workdir}/MiSTer.version"
          if [ ! -f "$verfile" ]; then
            echo "::error::debugfs could not extract /MiSTer.version from output/images/linux.img" >&2
            sed 's/^/    /' "${workdir}.debugfs.log" >&2 || true
            exit 1
          fi
          n=$(wc -c < "$verfile")
          if [ "$n" -ne 6 ]; then
            echo "::error::/MiSTer.version is ${n} bytes, expected exactly 6 (docs/downloader-contract.md §3/§12)" >&2
            exit 1
          fi
          last_byte_hex=$(tail -c1 "$verfile" | od -An -tx1 | tr -d ' ')
          if [ "$last_byte_hex" = "0a" ]; then
            echo "::error::/MiSTer.version ends in a newline -- this permanently breaks the Downloader's version-equality check (docs/downloader-contract.md §3)" >&2
            exit 1
          fi
          yymmdd=$(cat "$verfile")
          case "$yymmdd" in
            [0-9][0-9][0-9][0-9][0-9][0-9]) : ;;
            *)
              echo "::error::/MiSTer.version content '$yymmdd' is not 6 ASCII digits" >&2
              exit 1
              ;;
          esac
          # Verify the build honored the MISTER_VERSION override (ADR 0018):
          # /MiSTer.version must equal what we asked post-build.sh to bake.
          if [ "$yymmdd" != "${MISTER_VERSION:-}" ]; then
            echo "::error::built /MiSTer.version '$yymmdd' != requested MISTER_VERSION '${MISTER_VERSION:-<unset>}' -- post-build.sh did not honor the override" >&2
            exit 1
          fi
          # Assumption, flagged: century is hardcoded "20" (valid until the
          # year 2100). /MiSTer.version itself only ever carries YYMMDD, same
          # as stock's own convention (e.g. "250402" for release_20250402.7z).
          release_date="20${yymmdd}"
          echo "release_date=${release_date}" >> "$GITHUB_OUTPUT"
          echo "Resolved /MiSTer.version='${yymmdd}' -> RELEASE_DATE=${release_date}"

      ##########################################################################
      # Fetch + verify the pinned stock archive — MUST fully verify (MD5+size,
      # then a separate 7z internal-CRC test) before extracting a byte. These
      # four steps call scripts/verify-stock-payload.sh (runnable standalone);
      # the STOCK_* pins live only in this job's env: block above. See
      # docs/ci.md#stock-payload-verification.
      ##########################################################################
      - name: Fetch pinned stock release archive
        run: scripts/verify-stock-payload.sh fetch-stock stock_release.7z

      - name: Verify stock archive integrity (MD5, SHA-256, size)
        run: scripts/verify-stock-payload.sh verify-stock stock_release.7z

      - name: Extract files/linux/* from the verified stock archive
        run: scripts/verify-stock-payload.sh extract-stock stock_release.7z stock-extract

      - name: Re-verify stock uboot.img and updateboot hashes (defense in depth)
        run: scripts/verify-stock-payload.sh verify-uboot stock-extract

      ##########################################################################
      # Overlay our freshly built linux.img/zImage_dtb onto the verified stock
      # files/linux/ tree — mirrors the real Downloader's own on-device rsync.
      # See docs/ci.md#stock-payload-verification.
      ##########################################################################
      - name: Assemble release tree (files/linux/*)
        run: |
          set -eu
          mkdir -p release-stage
          cp -a stock-extract/files release-stage/files
          cp -f output/images/linux.img release-stage/files/linux/linux.img
          cp -f output/images/zImage_dtb release-stage/files/linux/zImage_dtb
          # ADD (not overlay) the statically-linked 7-Zip 26.02 that
          # package/7zip builds. The stock archive has NO 7za of any kind --
          # which is exactly why a stock device downloads p7zip 16.02 (2016)
          # from SD-Installer-Win64_MiSTer the first time it needs to extract
          # an update. The Downloader's own flash-phase rsync has no --delete
          # but DOES overwrite files present in the source, so shipping it here
          # replaces whatever /media/fat/linux/7za a device already has, on
          # every update. ADR 0023, docs/downloader-contract.md §4.
          #
          # This does NOT relax the hard constraint that our archive must stay
          # extractable by that old pinned binary: the very update that
          # installs our 7za is itself unpacked by whatever 7za was already
          # there. The qemu-arm round-trip step further down still runs the
          # 2016 binary against this archive, and must keep passing.
          cp -f output/images/7za release-stage/files/linux/7za
          echo "release-stage/files/linux/ contents:"
          find release-stage/files/linux -maxdepth 1 -printf '%f\n' | sort

      - name: Create release_${RELEASE_DATE}.7z (plain solid LZMA2, no BCJ2)
        env:
          RELEASE_DATE: ${{ steps.mister_version.outputs.release_date }}
        run: |
          set -eu
          # Plain solid LZMA2, not stock's BCJ2 (a Windows-7-Zip-GUI artifact,
          # irrelevant here) — see docs/ci.md#stock-payload-verification.
          #
          # -mf=off IS LOAD-BEARING, added 2026-07-27 with ADR 0023's files/linux/7za.
          # 7-Zip auto-detects an executable filter from the CONTENT it is given, so
          # the moment the payload gained an ARM ELF the encoding silently changed:
          # reproduced with this exact command, `Method = LZMA2 ARM` and Blocks = 2,
          # where the same command over an ELF-free payload gives plain
          # `Method = LZMA2`, Blocks = 1. That contradicts the "no BCJ/BCJ2/ARM
          # filter" guarantee docs/downloader-contract.md §4 makes, which the
          # pinned-2016-extractor constraint rests on. The ARM filter happens to be
          # readable by p7zip 16.02 (checked: `t` exit 0, extraction byte-identical),
          # so this is determinism and keeping a documented invariant TRUE, not a bug
          # fix — but the point of that invariant is precisely not to gamble on which
          # filters a decade-old extractor implements, and auto-detection is exactly a
          # gamble: a future payload member could trip a filter 16.02 lacks. The
          # roundtrip step below would catch that after the fact; -mf=off means it
          # cannot arise.
          #
          # NOT passing -snl, deliberately: upstream 7-Zip DEREFERENCES symlinks when
          # writing unless told otherwise (p7zip 16.02 stored them as links by
          # default — the defaults differ). release-stage/files/ holds no symlinks
          # today so there is nothing to preserve, and enabling it would add an
          # untested archive shape. If a symlink is ever added to the payload, revisit
          # this line: it would otherwise be silently flattened into a copy.
          ( cd release-stage && 7z a -mx=9 -m0=lzma2 -mf=off -ms=on "../dist/release_${RELEASE_DATE}.7z" files/ )
          echo "Created dist/release_${RELEASE_DATE}.7z"

      ##########################################################################
      # Verify with the EXACT pinned ARM 7za the real Downloader uses,
      # under qemu-arm — not a modern host 7z. See
      # docs/ci.md#stock-payload-verification.
      ##########################################################################
      - name: Fetch and verify the pinned ARM 7za
        run: scripts/verify-stock-payload.sh fetch-7za 7za

      # The pinned 7za is dynamically linked (glibc), not static -- qemu-arm
      # needs -L pointed at an ARM sysroot to resolve its loader/shared libs.
      # output/target (this job's own build) already has a matching glibc
      # sysroot, so it's reused here rather than installing armhf multiarch
      # packages on the runner. See docs/ci.md#stock-payload-verification.
      - name: Verify our archive extracts under the pinned ARM 7za (qemu-arm)
        env:
          RELEASE_DATE: ${{ steps.mister_version.outputs.release_date }}
        run: scripts/verify-stock-payload.sh roundtrip "dist/release_${RELEASE_DATE}.7z" ./7za downloader-extract output/target

      - name: Re-verify uboot.img/updateboot after the ARM-7za round trip
        run: scripts/verify-stock-payload.sh verify-uboot downloader-extract --hash-only

      - name: Verify archive layout matches the assembled contract tree
        env:
          RELEASE_DATE: ${{ steps.mister_version.outputs.release_date }}
        run: scripts/verify-stock-payload.sh verify-layout "dist/release_${RELEASE_DATE}.7z" release-stage

      # Generated ONCE, covering every asset (main seven + kernel-variant
      # extras) — no publish-side append step anymore. See
      # docs/ci.md#old-two-image-design-retired.
      - name: Generate SHA256SUMS
        env:
          RELEASE_DATE: ${{ steps.mister_version.outputs.release_date }}
        run: |
          set -eu
          ( cd dist && sha256sum "release_${RELEASE_DATE}.7z" linux.img zImage_dtb buildroot.config linux.config legal-info.tar.gz \
              zImage_dtb-* linux-*.config legal-info-*.tar.gz > SHA256SUMS )
          cat dist/SHA256SUMS

      ##########################################################################
      # sdcard installer image (TASKS.md P5.3, ADR 0017 §4 amended by ADR 0020).
      # Standalone flashable assets — never in release_YYYYMMDD.7z, never
      # referenced by db.json. See docs/ci.md#sdcard-contract.
      ##########################################################################

      # Reuses the stock archive already verified above by seeding
      # fetch-sdcard-payload.sh's own cache (it re-checks size+MD5+SHA-256, so
      # this is a hand-off of verified bytes, not a bypass). Skipped only on
      # an opt-in full-sdcard dispatch, where it would be pure redundancy. See
      # docs/ci.md#sdcard-contract and docs/ci.md#manual-full-sdcard-dispatch.
      - name: Build sdcard.img.xz (minimal installer image)
        if: ${{ !inputs.build_full_sdcard }}
        env:
          STAGE_DIR: ${{ github.workspace }}/output-sdcard-stage
        run: |
          set -eu
          mkdir -p "$STAGE_DIR/.fetch-cache"
          cp -f stock_release.7z "$STAGE_DIR/.fetch-cache/stock_release.7z"
          scripts/mk-sdcard.sh
          ls -la output/images/sdcard.img output/images/sdcard.img.xz

      # Static, offline contract check (partition table, uboot.img head, FAT32
      # payload inventory vs docs/verification/sdcard-payload.md). STOCK_UBOOT_*
      # come from the job env for the default uboot head compare. Same skip
      # condition as the build step it verifies.
      - name: Verify sdcard.img (scripts/check-sdcard.sh)
        if: ${{ !inputs.build_full_sdcard }}
        run: scripts/check-sdcard.sh output/images/sdcard.img

      # Opt-in only: the full variant bundles _Console cores (much larger, needs
      # the GitHub Contents API). Runs only on a workflow_dispatch with the input
      # set. Reuses the same warm STAGE_DIR (stock archive + installer builds
      # already there), just adds the cores; fetch-sdcard-payload.sh reconciles.
      - name: Build + verify sdcard-full.img.xz (opt-in _Console cores)
        if: ${{ inputs.build_full_sdcard }}
        env:
          STAGE_DIR: ${{ github.workspace }}/output-sdcard-stage
          SDCARD_CORES: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$STAGE_DIR/.fetch-cache"
          cp -f stock_release.7z "$STAGE_DIR/.fetch-cache/stock_release.7z"
          scripts/mk-sdcard.sh
          scripts/check-sdcard.sh output/images/sdcard-full.img
          ls -la output/images/sdcard-full.img output/images/sdcard-full.img.xz

      # Into dist/ so the existing "Upload release asset bundle" step carries them
      # to the publish job. sdcard-full.img.xz is only present when the opt-in
      # step above ran.
      - name: Stage sdcard image(s) into dist/
        run: |
          set -eu
          # Stage whichever variant(s) this run actually built. A tag push builds
          # the minimal image; an opt-in full dispatch (which SKIPS the minimal
          # build above, since the tag already carries it) builds only the full
          # one. The publish job's `gh release upload --clobber` then adds/refreshes
          # exactly what landed in dist/, leaving any already-attached asset intact.
          if [ -f output/images/sdcard.img.xz ]; then
            cp -f output/images/sdcard.img.xz dist/sdcard.img.xz
          fi
          if [ -f output/images/sdcard-full.img.xz ]; then
            cp -f output/images/sdcard-full.img.xz dist/sdcard-full.img.xz
          fi
          ls -la dist/

      # --- Release overview on the run's Summary page ------------------------
      # The tag, the internal version, the archive + image sizes, the full
      # SHA256SUMS, and -- most importantly -- the draft/db.json coupling a
      # human needs to understand before clicking Publish.
      - name: Release overview (job summary)
        env:
          RELEASE_DATE: ${{ steps.mister_version.outputs.release_date }}
          TAG: ${{ github.ref_name }}
        run: |
          set -u
          # shellcheck source=scripts/ci-lib.sh
          # Explicit fallback if ci-lib.sh is missing, rather than a silent
          # abort. See docs/ci.md#ci-lib-source-fallback.
          source scripts/ci-lib.sh || {
            echo "::warning::scripts/ci-lib.sh not found -- size facts below will read n/a" >&2
            ci_lib_sz() { echo "n/a"; }
          }
          arc="dist/release_${RELEASE_DATE}.7z"
          assets=$(find dist -maxdepth 1 -type f | wc -l)
          {
            echo "## 🚀 Release build summary"
            echo ""
            echo "| Fact | Value |"
            echo "|---|---|"
            echo "| Tag | \`${TAG}\` |"
            echo "| Internal version (\`/MiSTer.version\`) | \`${RELEASE_DATE}\` |"
            echo "| Archive | \`release_${RELEASE_DATE}.7z\` ($(ci_lib_sz "$arc")) |"
            echo "| linux.img | $(ci_lib_sz dist/linux.img) |"
            echo "| zImage_dtb | $(ci_lib_sz dist/zImage_dtb) |"
            echo "| Assets staged | ${assets} |"
            echo ""
            echo "**Verified before packaging:** stock archive MD5/SHA-256/size + 7z CRC · \`uboot.img\`/\`updateboot\` byte-identical to stock (before *and* after the archive round-trip) · our \`.7z\` extracts under the pinned ARM \`7za\` (qemu-arm) · archive member list matches docs/downloader-contract.md · rootfs passes the non-hardware parity suite (\`ci-tests.sh\`) and the ABI/SONAME checker (section above)."
            echo ""
            echo "**Next:** the \`publish\` job attests build provenance and creates a **DRAFT** GitHub Release. A draft is not public and does **not** trigger db.json publication (\`publish-db.yml\` gates on a *published, non-draft* release) until a human clicks **Publish**."
            echo ""
            echo "<details><summary>SHA256SUMS</summary>"
            echo ""
            echo '```'
            cat dist/SHA256SUMS 2>/dev/null || echo "(SHA256SUMS not found)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # A second, differently-timed disk/cache sample than the build action's
      # own (action.yml, if: always()) — taken AFTER the stock-archive
      # re-fetch, archive assembly, and sdcard builds, which are what's most
      # likely to exhaust the runner's disk. Not a duplicate; do not remove.
      # See docs/ci.md#disk-usage-double-sample.
      - name: Report disk & cache usage
        if: always()
        run: |
          echo "--- disk free ---"; df -h .
          echo "--- dl/ ---"; du -sh dl 2>/dev/null || true
          echo "--- output/host ---"; du -sh output/host 2>/dev/null || true
          echo "--- output (total) ---"; du -sh output 2>/dev/null || true
          echo "--- ccache ---"; du -sh "$GITHUB_WORKSPACE/.ccache" 2>/dev/null || true
          echo "--- dist/ ---"; ls -la dist/ 2>/dev/null || true

      # sha-named, not ref_name: upload-artifact REJECTS '/' in names, and a
      # branch dispatch's ref_name can contain one. See
      # docs/ci.md#artifact-naming-slash-trap.
      - name: Upload release asset bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # build-azcopy — builds the optional azcopy download (docs/azcopy.md).
  #
  # A SEPARATE JOB, AND THAT IS THE WHOLE POINT. azcopy is deliberately NOT in
  # the image (BR2_PACKAGE_AZCOPY is unset; 39 MiB, see docs/azcopy.md §1), so
  # the one thing this must never do is leak into linux.img. Building it in the
  # `build` job's output/ would do exactly that, and not hypothetically:
  # scripts/mk-sdcard.sh REGENERATES linux.img from that same output/ after the
  # image has already been staged ("snapshots that image BEFORE its own step-2
  # relink regenerates it" -- its own header). Anything sitting in output/target
  # at that moment ships. A different runner with a different checkout cannot
  # make that mistake, at any point in the step order, no matter what is added
  # to `build` later.
  #
  # It also costs nothing on the critical path. `build` is budgeted at 355 min
  # against a hard 360-min cap and has already overrun it once (see that job's
  # timeout comment); this runs concurrently instead of eating that ~36 min of
  # slack. The trade is one extra runner: measured ~4-5 min for host-go plus
  # ~12 s for azcopy itself, on top of the target toolchain.
  #
  # STATIC (CGO_ENABLED=0), for the same reason package/7zip ships a static
  # /media/fat/linux/7za: a downloaded binary OUTLIVES the rootfs that put it
  # there. It has to survive a rollback to an older linux.img, or to a stock
  # image whose glibc is years behind ours. A dynamic build dies at exec with
  # GLIBC_2.xx-not-found; static removes the failure mode. Costs the pure-Go
  # DNS resolver instead of glibc NSS, which is not a difference anyone will
  # notice here.
  # ============================================================================
  build-azcopy:
    name: Build azcopy (optional download)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          set -eu
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends \
            build-essential bash bc bison flex gawk \
            git patch gzip bzip2 xz-utils cpio unzip rsync \
            file wget curl ca-certificates perl \
            python3 python3-dev \
            libssl-dev libncurses-dev pkg-config texinfo \
            qemu-user

      # A DISTINCT cache key from the `build` job's br-dl-* on purpose. Sharing
      # it would let whichever job wrote first publish its dl/ under that key --
      # and this job's dl/ holds only the Buildroot tarball, azcopy and the Go
      # bootstrap, so if it won the race it would hand the image build a dl/
      # cache missing almost everything. Immutable-once-written caches make that
      # a silent slow rebuild, not an error.
      - name: Cache dl/ (azcopy job only)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dl/
          key: br-dl-azcopy-${{ hashFiles('Makefile', 'package/azcopy/azcopy.mk', 'package/azcopy/azcopy.hash') }}
          restore-keys: br-dl-azcopy-

      # `echo >> .config` + olddefconfig is the standard Buildroot idiom for
      # "the committed defconfig, plus this one symbol". It is used rather than
      # a committed fragment because there is exactly one symbol and no make
      # target to hang a fragment off (unlike configs/mister_rt.fragment, which
      # `make rt` exists to apply). BR2_PACKAGE_HOST_GO and
      # BR2_PACKAGE_CA_CERTIFICATES come along via the package's own `select`s.
      - name: Configure (defconfig + azcopy)
        run: |
          set -eu
          make mister_de10nano_defconfig
          echo 'BR2_PACKAGE_AZCOPY=y' >> output/.config
          make olddefconfig
          grep -qx 'BR2_PACKAGE_AZCOPY=y' output/.config

      # AZCOPY_GO_ENV is appended after HOST_GO_TARGET_ENV by pkg-golang.mk, so
      # this CGO_ENABLED wins over the =1 that config would otherwise give. Set
      # on the command line rather than in azcopy.mk because it is a property of
      # THIS artifact, not of the package: an in-image azcopy should keep cgo and
      # glibc's NSS resolver.
      - name: Build azcopy (static)
        run: make azcopy AZCOPY_GO_ENV=CGO_ENABLED=0

      # Fail loudly here rather than ship a binary nobody ran. `file` proves the
      # static link the whole artifact rationale rests on, and qemu-user proves
      # it actually executes on ARM -- the check that would have caught the
      # keyctl SIGILL (package/azcopy/0002-*) had it been in a startup path.
      - name: Verify the artifact
        run: |
          set -eu
          bin=output/target/usr/bin/azcopy
          ver=$(sed -n 's/^AZCOPY_VERSION[[:space:]]*=[[:space:]]*//p' package/azcopy/azcopy.mk | tr -d '[:space:]')
          file "$bin"
          file "$bin" | grep -q 'statically linked' || {
            echo "::error::azcopy is not statically linked -- CGO_ENABLED=0 did not take effect" >&2
            exit 1
          }
          got=$(qemu-arm "$bin" --version)
          echo "$got"
          [ "$got" = "azcopy version $ver" ] || {
            echo "::error::built azcopy reports '$got', expected 'azcopy version $ver'" >&2
            exit 1
          }

      - name: Stage azcopy-armv7 asset
        run: |
          set -eu
          ver=$(sed -n 's/^AZCOPY_VERSION[[:space:]]*=[[:space:]]*//p' package/azcopy/azcopy.mk | tr -d '[:space:]')
          mkdir -p azcopy-dist
          # Strip with the build's own cross strip, exactly as target-finalize
          # would (package/Makefile.in's STRIPCMD) -- `make azcopy` stops short
          # of that step, and the difference is ~16 MiB.
          #
          # Resolved into an array and asserted to be exactly one, rather than
          # $(echo <glob>). That shorthand degrades badly in both directions:
          # zero matches leaves the literal pattern and >1 leaves a
          # space-separated list, and each then fails at the strip invocation
          # with an error naming a path that never existed. It is unambiguous in
          # this tree today -- but "today" is doing real work in that sentence,
          # and a second cross toolchain appearing under output/host/bin is
          # exactly the kind of change nobody would think to re-check here.
          mapfile -t strips < <(ls output/host/bin/*-linux-*-strip 2>/dev/null || true)
          if [ "${#strips[@]}" -ne 1 ]; then
            echo "::error::expected exactly one cross strip matching output/host/bin/*-linux-*-strip, found ${#strips[@]}: ${strips[*]-<none>}" >&2
            exit 1
          fi
          cp output/target/usr/bin/azcopy azcopy-dist/azcopy
          "${strips[0]}" --remove-section=.comment --remove-section=.note azcopy-dist/azcopy
          ( cd azcopy-dist && xz -9 -T0 -c azcopy > "azcopy-${ver}-armv7.xz" && rm -f azcopy )
          ( cd azcopy-dist && sha256sum "azcopy-${ver}-armv7.xz" > "azcopy-${ver}-armv7.xz.sha256" )
          ls -l azcopy-dist/

      - name: Upload azcopy asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azcopy-dist-${{ github.sha }}
          path: azcopy-dist/
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # publish — attests provenance and creates the GitHub Release. Separate job
  # for the elevated write scopes (contents, id-token, attestations) the build
  # jobs must NOT have. See docs/ci.md#publish-job-scope.
  # ============================================================================
  publish:
    name: Attest provenance + create GitHub Release
    # build-azcopy is a hard dependency, not a soft one: a release that
    # silently dropped the optional azcopy download because that job failed
    # would look identical to a release that never carried it. Fail the
    # publish instead. See docs/ci.md#azcopy-release-asset.
    needs: [build, build-azcopy]
    runs-on: ubuntu-26.04

    # Only ever create a Release for a TAG. On a tag push this is always true, so
    # existing behaviour is unchanged; it exists so a workflow_dispatch on a
    # NON-tag ref (used to build the opt-in full sdcard variant) still runs the
    # `build` job's build+verify but does NOT mint a branch-named release here.
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write        # create the Release and upload its assets
      id-token: write         # attest-build-provenance's OIDC token exchange
      attestations: write     # publish the attestation to this repo

    steps:
      # ONE bundle now — build stages everything (main seven, variant extras,
      # sdcard images, SHA256SUMS) — nothing to merge/append here anymore.
      # See docs/ci.md#old-two-image-design-retired.
      - name: Download release asset bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: dist

      # Into the same dist/ the main bundle landed in, so the assets array
      # below stays one flat list. Separate artifact because it comes from a
      # separate job -- see build-azcopy's header for why that job is separate.
      - name: Download azcopy asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: azcopy-dist-${{ github.sha }}
          path: dist

      - name: List downloaded assets
        run: ls -la dist/

      # Re-derives the variant registry from dist/SHA256SUMS (this checkout-
      # less job has no scripts/list-kernel-variants.sh on disk — see
      # docs/ci.md#variants) and asserts BY NAME that all three files exist
      # for EVERY variant. A glob-and-count check could only ever notice the
      # ALL-missing case; this backstops the attestation step below, which
      # cannot police itself either. See docs/ci.md#attest-provenance-scope.
      - name: Verify every kernel variant's assets survived the artifact round trip
        run: |
          set -euo pipefail
          if [ ! -f dist/SHA256SUMS ]; then
            echo "::error::dist/SHA256SUMS is missing -- the build job's 'Generate SHA256SUMS' step should have produced it; refusing to publish a release whose asset manifest did not survive the release-dist-${{ github.sha }} round trip" >&2
            exit 1
          fi
          # `hash  name` (two spaces; a leading '*' if it was ever hashed in
          # binary mode) -- take field 2, keep only the zImage_dtb-<variant>
          # rows, and strip the prefix to leave the variant names.
          mapfile -t variants < <(awk '{ sub(/^\*/, "", $2); print $2 }' dist/SHA256SUMS | sed -n 's/^zImage_dtb-\(.*\)$/\1/p' | sort -u)
          if [ "${#variants[@]}" -eq 0 ]; then
            echo "::error::dist/SHA256SUMS records no zImage_dtb-<variant> entries (expected at least \`rt\`) -- the build-kernel matrix runs on every trigger that reaches this job, so zero variants is a bug, not a valid empty state" >&2
            exit 1
          fi
          echo "kernel variants recorded in SHA256SUMS: ${variants[*]}"
          missing=0
          : > "$RUNNER_TEMP/variant-assets.txt"
          for v in "${variants[@]}"; do
            for f in "dist/zImage_dtb-$v" "dist/linux-$v.config" "dist/legal-info-$v.tar.gz"; do
              if [ ! -f "$f" ]; then
                echo "::error::kernel-variant asset $f is missing from dist/ although SHA256SUMS records variant \`$v\` -- it went missing between the build job staging it and this job downloading release-dist-${{ github.sha }}" >&2
                missing=1
                continue
              fi
              printf '%s\n' "$f" >> "$RUNNER_TEMP/variant-assets.txt"
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to publish a release missing one or more kernel-variant assets" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/variant-assets.txt"

      # Attests only the shipped binaries; the zImage_dtb-* glob covers
      # whatever the kernel-variant matrix built. Do NOT rely on this action
      # to catch a missing variant asset itself — the verify step above is
      # what does that. See docs/ci.md#attest-provenance-scope.
      - name: Attest build provenance for the image assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/linux.img
            dist/zImage_dtb
            dist/zImage_dtb-*

      # Created as a DRAFT, deliberately: publish-db.yml only fires on a
      # published (non-draft) release — this is the human-approval gate
      # between "CI built an image" and "every subscribed MiSTer is offered
      # it." See docs/ci.md#release-draft-gate.
      - name: Create draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GH_REPO required: no checkout here, and gh ignores
          # $GITHUB_REPOSITORY — without it every `gh release` call dies at
          # repo-resolution and a green ~9h build silently produces NO
          # release. Inherited from origin/master's publish job; fixed here.
          # See docs/ci.md#gh-repo-bug.
          GH_REPO: ${{ github.repository }}
          RELEASE_DATE: ${{ needs.build.outputs.release_date }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # sdcard*.img.xz — standalone assets, never in the 7z, never in
          # db.json (ADR 0017 §4 / ADR 0020). See docs/ci.md#sdcard-contract.
          assets=(
            dist/"release_${RELEASE_DATE}.7z"
            dist/linux.img
            dist/zImage_dtb
            dist/SHA256SUMS
            dist/buildroot.config
            dist/linux.config
            dist/legal-info.tar.gz
          )
          # Per-variant assets are read back from
          # $RUNNER_TEMP/variant-assets.txt (written by the verify step
          # above), not named or globbed here — a glob-and-count could only
          # ever notice the ALL-missing case. See
          # docs/ci.md#release-assets-array.
          mapfile -t variant_assets < "$RUNNER_TEMP/variant-assets.txt"
          if [ "${#variant_assets[@]}" -eq 0 ]; then
            echo "::error::no kernel-variant assets listed in \$RUNNER_TEMP/variant-assets.txt (expected at least zImage_dtb-rt, linux-rt.config, legal-info-rt.tar.gz) -- the 'Verify every kernel variant's assets survived the artifact round trip' step should have written them and failed the job if it could not; refusing to publish a release missing its kernel-variant assets" >&2
            exit 1
          fi
          assets+=("${variant_assets[@]}")
          [ -f dist/sdcard.img.xz ] && assets+=(dist/sdcard.img.xz)
          [ -f dist/sdcard-full.img.xz ] && assets+=(dist/sdcard-full.img.xz)
          # azcopy: globbed rather than named because the filename carries the
          # package's version (azcopy-<ver>-armv7.xz), and this job has no
          # checkout to read AZCOPY_VERSION from. Unlike the sdcard lines above
          # this is NOT optional -- build-azcopy is in `needs:` and uploads with
          # if-no-files-found: error, so an empty glob here means something
          # upstream lied and the release must not go out half-assembled.
          mapfile -t azcopy_assets < <(ls dist/azcopy-*-armv7.xz dist/azcopy-*-armv7.xz.sha256 2>/dev/null || true)
          if [ "${#azcopy_assets[@]}" -ne 2 ]; then
            echo "::error::expected dist/azcopy-<ver>-armv7.xz and its .sha256 from the build-azcopy job, found ${#azcopy_assets[@]} file(s); refusing to publish a release missing the optional azcopy download" >&2
            exit 1
          fi
          assets+=("${azcopy_assets[@]}")
          # Added unconditionally (build-kernel always runs, so at least one
          # variant is guaranteed — the verify step above already failed the
          # job otherwise). The release-notes prose below is a hand-edit per
          # variant, same as mk-sdcard.sh's single bonus-kernel slot — see
          # docs/ci.md#variants for the full accounting.
          notes="Automated release build. Internal linux version (baked \`/MiSTer.version\`): ${RELEASE_DATE}. See SHA256SUMS for asset hashes and the attached build-provenance attestation (verify with \`gh attestation verify <asset> --owner ${{ github.repository_owner }}\`). The \`sdcard*.img.xz\` assets are standalone flashable installer images (ADR 0020); they are NOT part of release_${RELEASE_DATE}.7z and are not referenced by db.json.

          **Complete corresponding source (GPL/LGPL):** every binary here is built from free/open-source software with Buildroot. \`legal-info.tar.gz\` (main image) and \`legal-info-rt.tar.gz\` (RT kernel) ship the SBOM — \`manifest.csv\` listing each package's exact version, license, and pinned upstream source URL+hash — plus every license text, all local patches we apply, and \`buildroot.config\`. The upstream source archives themselves are deliberately NOT bundled: they are the freely-available, hash-pinned upstreams \`manifest.csv\` points to, and re-bundling ~1.4 GiB of them (591 MiB of that the linux-firmware blob alone) into every release only duplicated what upstream + this repo already provide. The complete corresponding source for every GPL/LGPL component is (a) the upstream archives at the exact versions/URLs in \`manifest.csv\`, byte-verifiable against their recorded hashes, plus (b) this repository at tag \`${{ github.ref_name }}\`, which carries the full Buildroot configuration and all applied patches and rebuilds the identical images with \`make\`. **Written offer:** for at least three years from this release, we will additionally provide a complete machine-readable copy of the corresponding source for any component on request — open an issue at https://github.com/${{ github.repository }}.

          **azcopy (optional, ARMv7):** \`azcopy-<version>-armv7.xz\` is Microsoft's Azure Storage CLI, for backing the card's \`saves\`/\`savestates\`/\`screenshots\`/\`config\` up to Azure Storage from the board itself. It is a STANDALONE DOWNLOAD and is deliberately **not** in \`linux.img\`: at 39 MiB installed it would be the second-largest thing in the image after Samba, for a tool most owners will never run — and almost all of that size is Google Cloud Storage support that a MiSTer never executes (an empty Go binary is 1.2 MB; +Azure SDK 5.5 MB; +GCS 27.6 MB). Statically linked on purpose, so it keeps working if you roll back to an older image or to stock. To use it: \`xz -d\` it onto \`/media/fat\`, \`chmod +x\`, and set \`AZCOPY_JOB_PLAN_LOCATION\`/\`AZCOPY_LOG_LOCATION\` under \`/media/fat\` plus \`AZCOPY_BUFFER_GB=0.125\` — that last one matters, because AzCopy otherwise sizes its buffer cache at 1 GiB on a board with 511 MiB of RAM. Microsoft does not build or test AzCopy for 32-bit ARM; this build carries two local patches to make it compile and to stop every \`azcopy login\` dying on SIGILL. See \`docs/azcopy.md\` for the full write-up and the on-hardware test record.

          **PREEMPT_RT beta (Linux 7.2):** \`zImage_dtb-rt\` is a separately compiled real-time kernel (docs/rt-beta-kernel.md, ADR 0021 as amended 2026-07-18) — never referenced by db.json, so the Downloader will not offer it. The ONE \`linux.img\` above already contains BOTH kernels' module trees, so no separate rootfs exists and — once the device is running THIS release's \`linux.img\` (a linux.img from before this release carries only 6.18 modules, and the RT kernel would boot with none of its drivers) — no extra flash is needed: opt in by copying \`zImage_dtb-rt\` to \`/media/fat/linux/\` and adding \`bootimage=/linux/zImage_dtb-rt\` to u-boot.txt (remove the line to roll back). \`linux-rt.config\` is its kernel config; \`legal-info-rt.tar.gz\` carries the RT kernel's applied patches + SBOM (license texts and manifest.csv with the pinned upstream source URL+hash) — the same patches-only form as the main \`legal-info.tar.gz\`, covered by the corresponding-source note above. It is a MANUAL download only: the sdcard installer image deliberately does NOT carry it (ADR 0021 item 4, reversed 2026-07-27 — an unvalidated real-time kernel does not belong on every user's card). Status: build-verified only. Earlier pins booted and ran MiSTer on one DE10-Nano — 7.2-rc4 on 2026-07-20 and 7.2-rc7 on 2026-08-14 — but boot is a per-version claim, so treat the kernel in THIS release as unvalidated on hardware unless a maintainer says otherwise. (This paragraph is hand-maintained prose and its version can go stale ahead of the pin; \`linux-rt.config\` in this same release is authoritative for what was actually built.) The pin tracks the 7.2.y line as of 2026-08-17 — it no longer follows mainline \`-rc\`, so this caveat is re-opened by a point release rather than weekly. No latency measurement has been taken on any version."
          # Upsert, not create-only: a tagged push already created the draft,
          # so an opt-in full-sdcard dispatch (same tag) must ADD assets
          # rather than fail on already-exists. See
          # docs/ci.md#release-assets-array.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes "$notes" \
              "${assets[@]}"
          fi

      - name: Publish summary (job summary)
        env:
          RELEASE_DATE: ${{ needs.build.outputs.release_date }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## 📦 Draft release created"
            echo ""
            echo "Draft GitHub Release **${TAG}** created (internal version \`${RELEASE_DATE}\`); build provenance attested for \`linux.img\`, \`zImage_dtb\` and \`zImage_dtb-rt\`. The three \`*-rt\` assets are the PREEMPT_RT beta kernel (ADR 0021 as amended — its MODULES ride inside the one \`linux.img\`) — separate downloads, never in the 7z, never in db.json."
            echo ""
            echo "> ⚠️ **This is a draft.** It is not public, and db.json is **not** published while it stays a draft."
            echo "> Clicking **Publish release** — whether as a full release *or* a pre-release — fires \`publish-db.yml\`, which regenerates and publishes db.json to opted-in devices. **The pre-release flag does not prevent that** (the guard there checks draft, not pre-release). For a smoke test, leave it a draft and delete it when done."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # dependency-graph — re-publishes the release's SBOM through GitHub's
  # dependency submission API so it lands in /network/dependencies (and, for
  # anything the advisory database can match, Dependabot). The SBOM itself is
  # not regenerated here: the input is the manifest.csv inside the
  # legal-info*.tar.gz assets the release actually shipped, so the graph and
  # the tarball cannot disagree.
  #
  # RELEASE ONLY, deliberately — build.yml never submits. A dependency graph
  # is a claim about what is published, and build.yml's manifest-only SBOM
  # describes an image that is distributed to nobody. See
  # docs/ci.md#dependency-graph-submission.
  # ============================================================================
  dependency-graph:
    name: Publish SBOM to the dependency graph
    # publish, not build: nothing should appear in the graph for a release
    # that failed to get created. `publish` needs `build` transitively, which
    # is what makes the release-dist artifact below available.
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    # Same tag guard as `publish` (whose `if:` this does NOT inherit —
    # `needs:` on a skipped job skips this one too, but the guard is repeated
    # so the intent is readable here rather than inferred).
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write        # the dependency submission API requires it

    steps:
      # Unlike `publish` this job DOES check out: it runs
      # scripts/sbom-to-dependency-snapshot.py. Nothing else here needs the
      # tree, so the checkout is shallow by default.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pulls the whole release bundle (several GiB) for two small tarballs.
      # That is deliberate: extracting the manifests from the assets that were
      # actually published is what makes the graph and the release agree, and
      # a ~1-minute artifact download is immaterial against a ~9-hour release
      # pipeline. Do not "optimise" this into a second, separately-staged
      # manifest artifact — that would reintroduce a way for the two to drift.
      - name: Download release asset bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: dist

      # ci_lib_package_legal_info archives with `-C <output_dir> legal-info`,
      # so every bundle carries its manifest at exactly legal-info/manifest.csv.
      # Each is unpacked under the Buildroot output dir it came from
      # (legal-info.tar.gz -> output/, legal-info-rt.tar.gz -> output-rt/) and
      # named that way in the snapshot, which is both stable across releases
      # and self-describing in the graph UI.
      #
      # The variant glob is safe to trust here in a way it would not be in
      # `publish`: `needs: publish` means that job's by-name check for
      # legal-info-<variant>.tar.gz has already passed for EVERY variant in
      # SHA256SUMS. Only the main bundle is re-asserted by name below.
      - name: Extract each shipped legal-info bundle's manifest.csv
        id: manifests
        run: |
          set -euo pipefail
          if [ ! -f dist/legal-info.tar.gz ]; then
            echo "::error::dist/legal-info.tar.gz is missing from the release-dist bundle -- the main image's SBOM is what this job exists to publish; refusing to submit a dependency snapshot without it" >&2
            exit 1
          fi
          shopt -s nullglob
          : > "$RUNNER_TEMP/manifest-args.txt"
          for tgz in dist/legal-info.tar.gz dist/legal-info-*.tar.gz; do
            base=$(basename "$tgz" .tar.gz)
            case "$base" in
              legal-info)   outdir=output ;;
              legal-info-*) outdir="output-${base#legal-info-}" ;;
              *)
                echo "::error::unexpected legal-info bundle name '$tgz'" >&2
                exit 1
                ;;
            esac
            dest="$RUNNER_TEMP/sbom/$outdir"
            mkdir -p "$dest"
            # One member, named explicitly: a bundle that somehow lost its
            # manifest must fail here, not silently contribute nothing.
            if ! tar -xzf "$tgz" -C "$dest" legal-info/manifest.csv; then
              echo "::error::$tgz does not contain legal-info/manifest.csv -- ci_lib_package_legal_info's archive layout changed, or the bundle is truncated" >&2
              exit 1
            fi
            printf -- '--manifest\n%s\n' \
              "${outdir}/legal-info/manifest.csv=${dest}/legal-info/manifest.csv" \
              >> "$RUNNER_TEMP/manifest-args.txt"
            echo "staged ${tgz} -> ${outdir}/legal-info/manifest.csv ($(wc -l < "${dest}/legal-info/manifest.csv") lines)"
          done

      # THE load-bearing step. GitHub only updates a repository's dependency
      # results from a snapshot whose `ref` is the DEFAULT BRANCH: a
      # refs/tags/... ref is accepted with a 201 and then quietly ignored
      # ("The snapshot was accepted, but it is not for the default branch"),
      # which is exactly the shape of failure this whole job was added to fix.
      # Since a release tag is cut from master, the tagged commit IS on the
      # default branch and submitting under refs/heads/<default> is accurate,
      # not a fiction -- but that has to be CHECKED, not assumed, so a tag cut
      # from an unmerged branch never claims to describe master.
      #
      # compare/<default>...<sha>: `identical` = the tag is the branch tip,
      # `behind` = the tagged commit is an ancestor of it. `ahead`/`diverged`
      # mean the commit is not on the default branch at all.
      # See docs/ci.md#dependency-graph-default-branch.
      - name: Resolve the ref to submit the snapshot under
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/${GH_REPO}" --jq '.default_branch')
          echo "default branch: ${default_branch}"
          status=$(gh api "repos/${GH_REPO}/compare/${default_branch}...${SHA}" --jq '.status')
          echo "compare ${default_branch}...${SHA}: ${status}"
          case "$status" in
            identical|behind)
              echo "ref=refs/heads/${default_branch}" >> "$GITHUB_OUTPUT"
              echo "on_default_branch=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ref=${TAG_REF}" >> "$GITHUB_OUTPUT"
              echo "on_default_branch=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Dependency graph will not be updated::Tagged commit ${SHA} is '${status}' relative to ${default_branch}, i.e. it is not on the default branch, so this snapshot is submitted under ${TAG_REF}. GitHub accepts such a snapshot and then ignores it -- /network/dependencies will keep showing the previous release's packages. Merge the tagged commit to ${default_branch} and re-tag if the graph should reflect it."
              ;;
          esac

      - name: Build the dependency snapshot from the SBOM
        env:
          SHA: ${{ github.sha }}
          REF: ${{ steps.ref.outputs.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t manifest_args < "$RUNNER_TEMP/manifest-args.txt"
          if [ "${#manifest_args[@]}" -eq 0 ]; then
            echo "::error::no manifests were staged -- the extract step should have failed first" >&2
            exit 1
          fi
          # job-correlator is a HARDCODED literal, not github.workflow/job:
          # GitHub keeps only the newest snapshot per (correlator, detector
          # name), so each release must reuse this exact string to supersede
          # the last one. Renaming the workflow must not orphan the series.
          python3 scripts/sbom-to-dependency-snapshot.py \
            "${manifest_args[@]}" \
            --sha "$SHA" \
            --ref "$REF" \
            --job-id "$RUN_ID" \
            --job-correlator 'release_buildroot-sbom' \
            --job-html-url "$RUN_URL" \
            --detector-url "$REPO_URL" \
            --out "$RUNNER_TEMP/dependency-snapshot.json"

      - name: Submit the snapshot to the dependency submission API
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ON_DEFAULT_BRANCH: ${{ steps.ref.outputs.on_default_branch }}
        run: |
          set -euo pipefail
          resp="$RUNNER_TEMP/snapshot-response.json"
          err="$RUNNER_TEMP/snapshot-response.err"
          if ! gh api --method POST \
                 -H "Accept: application/vnd.github+json" \
                 "/repos/${GH_REPO}/dependency-graph/snapshots" \
                 --input "$RUNNER_TEMP/dependency-snapshot.json" \
                 > "$resp" 2> "$err"; then
            echo "::error::POST /repos/${GH_REPO}/dependency-graph/snapshots failed. A 403 usually means the dependency graph is disabled for this repository (Settings -> Advanced Security -> Dependency graph); a 404 means the endpoint is unavailable for this repository type." >&2
            # BOTH streams: `gh api` writes its own "(HTTP 4xx)" line to
            # stderr but the API's JSON error body -- the part that says WHY,
            # e.g. a per-field validation message -- to stdout, which is
            # captured in $resp. Printing only stderr throws that away.
            sed 's/^/    /' "$err" >&2 || true
            sed 's/^/    /' "$resp" >&2 || true
            exit 1
          fi
          cat "$resp"
          result=$(jq -r '.result // ""' "$resp")
          # Flattened to one line before it ever reaches $GITHUB_OUTPUT: a
          # newline in an API-supplied value is how a `key=value` output line
          # gets corrupted (and is the classic output-injection shape). It
          # also has to survive being printed inside a markdown table row in
          # the summary step below.
          message=$(jq -r '.message // ""' "$resp" | tr '\n' ' ')
          echo "message=${message}" >> "$GITHUB_OUTPUT"
          if [ "$result" != "SUCCESS" ]; then
            echo "::error::dependency snapshot was not accepted (result='${result}'): ${message}" >&2
            exit 1
          fi
          # A 201 with SUCCESS still does NOT mean the graph was updated --
          # that is exactly what the default-branch wording reports. Treat it
          # as a hard failure when the ref step believed it WAS submitting for
          # the default branch: something in that reasoning is wrong and
          # silently shipping an unchanged graph is the bug being fixed.
          case "$message" in
            *"not for the default branch"*)
              if [ "$ON_DEFAULT_BRANCH" = "true" ]; then
                echo "::error::GitHub reports the snapshot is not for the default branch even though the tagged commit was verified to be on it: ${message}" >&2
                exit 1
              fi
              echo "::warning title=Dependency graph not updated::${message}"
              ;;
          esac

      - name: Dependency-graph summary (job summary)
        if: always() && steps.manifests.outcome == 'success'
        env:
          REF: ${{ steps.ref.outputs.ref }}
          MESSAGE: ${{ steps.submit.outputs.message }}
          OUTCOME: ${{ steps.submit.outcome }}
          DEPS_URL: ${{ github.server_url }}/${{ github.repository }}/network/dependencies
        run: |
          set -eu
          {
            echo "## 🧾 SBOM published to the dependency graph"
            echo ""
            echo "| Fact | Value |"
            echo "|---|---|"
            echo "| Submitted under ref | \`${REF:-n/a}\` |"
            echo "| Submit step outcome | ${OUTCOME:-n/a} |"
            echo "| API message | ${MESSAGE:-n/a} |"
            echo ""
            echo "Packages per manifest:"
            echo ""
            echo '```'
            jq -r '.manifests | to_entries[] | "\(.key): \(.value.resolved | length) packages"' \
              "$RUNNER_TEMP/dependency-snapshot.json" 2>/dev/null || echo "(snapshot not built)"
            echo '```'
            echo ""
            echo "View at ${DEPS_URL} (the graph can take a few minutes to reflect a new submission)."
          } >> "$GITHUB_STEP_SUMMARY"
