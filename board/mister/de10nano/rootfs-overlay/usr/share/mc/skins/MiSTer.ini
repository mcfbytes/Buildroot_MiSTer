#
# MiSTer
#

[skin]
    description = MiSTer
    256colors = false

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = color7;color0
    selected = color0;color14
    marked = color11
    markselect = color11;color14
    gauge = color15;color1
    input = color15
    inputmark = color11;color1
    inputunchanged =
    commandlinemark = color11;color1
    reverse = color0;color7
    header = color3
    disabled = color8;color1
    #inputhistory =
    #commandhistory =

[dialog]
    _default_ = color0;color7
    dhotnormal = color1
    dfocus = color15;color1
    dhotfocus = color11;color1
    dtitle = color0

[error]
    _default_ = color15;color1
    errdfocus = color11;color0
    errdhotnormal = color14
    errdhotfocus = color14;color0
    errdtitle = color11

[filehighlight]
    directory = color15
    executable = color10
    symlink = color12
    hardlink =
    stalelink = color9
    device = color13
    special = color3
    core = color9
    temp = color8
    archive = color3
    doc = color14
    source = color6
    media = color5
    graph = color13
    database = color2

[menu]
    _default_ = color0;color7
    menusel = color15;color1
    menuhot = color1
    menuhotsel = color11;color1
    menuinactive = color8

[popupmenu]
    _default_ = color0;color7
    menusel = color11;color1
    menutitle = color11

[buttonbar]
    button = color0;color7
    hotkey = color15;color0

[statusbar]
    _default_ = color15;color4

[help]
    _default_ = color0;color7
    helpitalic = color14
    helpbold = color5
    helplink = color11
    helpslink = color11;color1
    helptitle = color0

[editor]
    _default_ = color7;color0
    editbold = color15
    editmarked = color11;color1
    editwhitespace = color12;color4
    editlinestate = color1;color0
    bookmark = color0;color7
    bookmarkfound = color0;color7
    editrightmargin = color0;color7

[viewer]
    _default_ = color7;color0
    viewbold = color15
    viewunderline = ;;underline
    viewselected = color11;color1

[diffviewer]
    changedline = color15;color4
    changednew = color15;color5
    changed = color15;color3
    added = color0;color7
    removed = color8;color0
    error = color15;color1

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓

[widget-panel]
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = «
    history-next-item-sign = »
    history-show-list-sign = ^

[widget-scollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒
