% minijail-config-file v0

# Sinden's driver, used by /usr/sbin/mister-sinden-lightgun through /usr/lib/mister/jail.sh.
# Why each line: docs/minijail.md "Sinden Lightgun driver".

# uid/gid 8428 (users.table), no capabilities: the nodes in its /dev are its own.
u = 8428
g = 8428
c = 0x0

# Mount, PID, IPC and network namespaces: it uses no network at all.
ns-mount
I
l
e

bind-mount = /usr
bind-mount = /etc/mono
bind-mount = /etc/udev
bind-mount = /etc/passwd
bind-mount = /etc/group
bind-mount = /etc/nsswitch.conf
mount = proc,/proc,proc,MS_RDONLY|MS_NOSUID|MS_NODEV|MS_NOEXEC
bind-mount = /sys
bind-mount = /run/udev
bind-mount = /run/log
# Its own /dev: null, urandom and each gun's camera and serial nodes.
mount = /dev/sinden-lightgun,/dev,none,MS_BIND
mount = /dev/sinden-lightgun,/dev,none,MS_BIND|MS_REMOUNT|MS_NOEXEC|MS_NOSUID
# The one card directory it sees, read-only: the downloaded driver and its settings.
mount = /media/fat/linux/sinden,/media/fat/linux/sinden,none,MS_BIND
mount = /media/fat/linux/sinden,/media/fat/linux/sinden,none,MS_BIND|MS_REMOUNT|MS_RDONLY|MS_NOSUID|MS_NODEV
mount = tmpfs,/tmp,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC,mode=1777,size=1m
# Writable by its modes, granted by no Landlock rule: the start's Landlock probe.
mount = tmpfs,/var/empty,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC,mode=1777,size=4k

fs-path-rx = /usr
fs-path-rx = /media/fat/linux/sinden
fs-path-ro = /etc
fs-path-ro = /proc
fs-path-ro = /sys
fs-path-ro = /run/udev
fs-path-ro = /run/log
fs-path-advanced-rw = /dev
fs-path-advanced-rw = /tmp
