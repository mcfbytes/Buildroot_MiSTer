# /etc/mc/filehighlight.ini -- MiSTer-adapted copy of mc 4.8.33's own
# filehighlight.ini (T3, docs/stock-reconciliation.md §3c).
#
# Base: misc/filehighlight.ini from the mc-4.8.33 tarball (the file the mc
# package installs at this exact path -- misc/Makefile.am:30/42, LIBFILES_CONST
# into cfgdir=$(sysconfdir)/mc; the rootfs overlay is copied after packages
# install, so this copy shadows it deliberately -- the same mechanism stock's
# addon.tar used on its mc 4.8.25 file). TWO deltas vs the package default,
# both ported from stock's addon.tar copy (verified bytes in
# work/imgroot/etc/mc/filehighlight.ini), both pure cosmetics that pair with
# the MiSTer skin (usr/share/mc/skins/MiSTer.ini, [filehighlight] core/media):
#
#   1. [core] ALSO highlights MiSTer core bitstreams: `extensions=rbf` added,
#      `extensions_case` flipped true->false. On a MiSTer "core" means an FPGA
#      core, and colored .rbf files in /media/fat are the visible point of the
#      whole skin. This is stock's [core] byte-for-byte
#      (work/imgroot/etc/mc/filehighlight.ini:22-25) -- note it is an ADDITION,
#      not a trade: upstream's Unix-coredump `regexp=^core\\.*\\d*$` is KEPT.
#      mc parses `regexp` and `extensions` as two independent filters on the
#      same group (lib/filehighlight/ini-file-read.c:251 and :256 each append
#      one), so both patterns colorize and neither shadows the other. An
#      earlier draft of this file dropped the regexp; that was a third,
#      undocumented delta stock never took, and it is not repeated.
#   2. [media] gains vgm;vgz (stock had them: VGM chiptune dumps, the files
#      m3u_play/vgmplay handle on stock). Kept even though vgmplay itself is
#      not shipped (§3c) -- the color marks the file type, not the player.
#
# Stock's OTHER divergences from its own 4.8.25 base (extensions_case=false
# everywhere, the empty [executable] type, dropped "part" from [temp], and its
# 5-years-older extension lists) are NOT ported: they are either accidental
# (the [executable] neutering makes +x files render unhighlighted) or simply
# the older upstream defaults, and 4.8.33's lists are the better baseline.
#
# MAINTENANCE: pinned to mc 4.8.33 -- if Buildroot's mc moves, re-derive from
# the new misc/filehighlight.ini and re-apply the two deltas above.

[executable]
    type=FILE_EXE

[directory]
    type=DIR

[device]
    type=DEVICE

[special]
    type=SPECIAL

[stalelink]
    type=STALE_LINK

[symlink]
    type=SYMLINK

[core]
    extensions=rbf
    extensions_case=false
    regexp=^core\\.*\\d*$

[temp]
    extensions=~;$$$;bak;part;tmp
    regexp=(^#.*|.*~$)

[archive]
    extensions=7z;Z;ace;apk;arc;arj;ark;bz2;cab;cpio;deb;gz;lha;lz;lz4;lzh;lzma;lzo;rar;rpm;tar;tbz;tbz2;tgz;tlz;txz;tzo;tzst;vsix;xz;zip;zoo;zst

[doc]
    extensions=chm;css;ctl;diz;doc;docm;docx;dtd;fodg;fodp;fods;fodt;htm;html;json;letter;lsm;mail;man;markdown;md;me;mkd;msg;nroff;odg;odp;ods;odt;pdf;po;ppt;pptm;pptx;ps;rtf;sgml;shtml;tex;text;txt;xls;xlsm;xlsx;xml;xsd;xslt

[source]
    extensions=ada;asm;awk;bash;c;c++;caml;cc;cgi;cpp;cxx;diff;erl;go;h;h++;hh;hi;hpp;hs;inc;jasm;jav;java;js;m4;mak;mjs;ml;mli;mll;mlp;mly;pas;patch;php;phps;pl;pm;prg;py;rb;s;sas;sh;sl;st;swift;tcl;tk;tsx;xq

[media]
    extensions=3gp;aac;ac3;ape;asf;avi;awb;dts;flac;flv;it;m3u;m4a;m4v;med;mid;midi;mkv;mod;mol;mov;mp2;mp3;mp4;mpeg;mpg;mpl;ogg;ogv;opus;s3m;ts;umx;vob;wav;webm;wma;wmv;xm;y4m;vgm;vgz

[graph]
    extensions=ai;avif;bmp;cdr;eps;gif;heic;heif;ico;jp2;jpeg;jpg;jxl;omf;pcx;pic;png;psb;psd;rle;svg;tga;tif;tiff;webp;wmf;xbm;xcf;xpm

[database]
    extensions=cdx;dat;db;dbf;dbi;dbx;fox;mdb;mdn;mdx;msql;mssql;pgsql;sql;ssql

# Hardlinks have lowest precedence to make it colored by file type or extension
[hardlink]
    type=HARDLINK
