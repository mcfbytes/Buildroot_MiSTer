# shellcheck shell=sh disable=SC2034  # every name here is read by the scripts that source it
# Sourced by install-flag and the installer: the flag's one definition.
# genimage-sdcard.cfg (offset/size 512K) and scripts/mk-sdcard.sh check against these.
FLAG_SLOT=3
FLAG_LBA=1024
FLAG_SECTORS=1024
FLAG_TYPE=218   # 0xda, decimal so the MBR writer and the probe share one spelling
FLAG_REF=/usr/lib/mister/install-flag.bin

# partdev DISK N -- mmcblk0 -> mmcblk0p3, vda -> vda3 (the kernel's naming)
partdev() {
	case "$1" in
	*[0-9]) printf '%sp%s' "$1" "$2" ;;
	*)      printf '%s%s' "$1" "$2" ;;
	esac
}
