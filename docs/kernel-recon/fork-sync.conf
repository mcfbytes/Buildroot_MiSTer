# fork-sync.conf — how far we have reconciled MiSTer-devel/Linux-Kernel_MiSTer.
#
# WHY THIS FILE EXISTS
# --------------------
# This repo is the source of truth for the MiSTer kernel: the patch series in
# board/mister/de10nano/linux-patches/ is what gets built, and scripts/export-kernel-tree.sh
# renders it into the fork's tree format. But the fork is a live repo that other people
# commit to. Anything landing there after our last reconciliation is, by definition,
# something this repo does not have and nobody has decided about.
#
# Left to humans that decision never gets made -- not through neglect, but because there
# is no moment that forces the question. The fork sat on 5.15.1 for 210 stable releases
# for exactly this reason: nothing ever said "these N commits are unaccounted for".
#
# So this file records the last commit on each fork branch whose content has a disposition
# in docs/patch-provenance.md, and scripts/check-fork-sync.sh diffs it against the fork's
# live HEADs. .github/workflows/fork-sync.yml runs that weekly and opens an issue when the
# answer is non-empty. The queue is then a fact rather than a memory.
#
# FORMAT
#   <branch>  <full-40-char-sha>
# Comments and blank lines ignored. Full SHAs only -- an abbreviation that is unambiguous
# today can collide later, and this is compared, not just displayed.
#
# UPDATING
# Move a line ONLY when the commits it skips past have been dispositioned -- a structured
# record at docs/kernel-recon/records/<full-sha>.json (the CURRENT mechanism, and the one to
# use) or, for the pre-2026-07 campaign, a row in docs/patch-provenance.md -- carried into the
# series, or recorded as deliberately dropped with a reason. Advancing it to silence the issue
# is the one thing that breaks this: the file stops meaning "reconciled" and starts meaning
# "seen", which is what it exists to prevent. A comment in THIS file is not a disposition
# either; 794e6f002 was advanced past that way on 2026-07-16 and had to be retrofitted with a
# real record on 2026-07-24.
#
# "Dispositioned" also does not mean "closed". A record may disposition a commit and still
# carry an open recommendation -- see the MiSTer-v6.18 note below.
#
# WHY BOTH BRANCHES
#   MiSTer-v5.15 -- the fork's historical line and the baseline the whole reconciliation
#     was performed against (docs/patch-provenance.md's header names f0fb626ac; this is
#     now ahead of that, see below). Still actively committed to.
#   MiSTer-v6.18 -- upstream's own vanilla 6.18.38 base, created 2026-07-16, which our
#     export now replays onto (MiSTer-devel/Linux-Kernel_MiSTer#75). Once that merges,
#     commits landing here are changes made to OUR series by other people, and they have
#     to flow back into linux-patches/ or the next regeneration silently erases them.
#     This is the direction that matters most for keeping this repo the source of truth.

# Reconciled: docs/patch-provenance.md dispositioned every commit up to f0fb626ac.
#
# Advanced to 794e6f002 on 2026-07-16 -- BUT on prose alone, with no record file. That is the
# "seen, not reconciled" failure mode this file's own UPDATING note warns against, so the
# 2026-07-24 pass went back and supplied the evidence:
# docs/kernel-recon/records/794e6f002d0f655c504733c126a01f8c1f0bc1d4.json now dispositions it
# dropped-upstream, with the mainline Kconfig quoted and every functional symbol the fork
# commit sets (RTW88{,_CORE,_USB,_8821C,_8821CU,_LEDS}) shown resolving in our own build.
#
# Advanced to 5fcfae369 on 2026-07-24: the single commit since (5fcfae369, "config: enable
# CONFIG_TUN for tap device support (#76)") is dispositioned in
# records/5fcfae36975b217f6ab82b501065f3b13173ae15.json and ACTED ON -- CONFIG_TUN=y is now
# in board/mister/de10nano/linux.config, verified to survive olddefconfig against v6.18.39.
MiSTer-v5.15  5fcfae36975b217f6ab82b501065f3b13173ae15

# Upstream's own forward-port of the MiSTer series onto v6.18.38, created 2026-07-21..23 --
# Sorgelig's independent effort, developed in parallel with our export (PR #75) and rooted at
# the same base commit d9ac12a691, NOT derived from it.
#
# Advanced from d9ac12a691 to e8f065dbf8 on 2026-07-24. The contract above says move this
# ONLY when the skipped commits are dispositioned, so here is why all 57 are. Every one is a
# re-port of a MiSTer-v5.15 commit that already has a record in records/: comparing the two
# subject sets leaves just three v6.18 subjects without a byte-identical v5.15 twin, and all
# three are renames of commits we hold records for --
#   "exfat: support for symlinks."  <- v5.15 "Add exFAT with symlinks support." + "exfat: use
#                                      ATTR_SYSTEM as symlink flag ..." (we carry 0031)
#   "fix for 3rd party DS4 ..."     <- v5.15 "hid-sony: fix for 3rd party DS4 ..." (0022)
#   "Add MiSTer_defconfig"          <- v5.15 "Add defconfig." lineage (config axis)
# Backed by a tree-level diff (the §3.3 completeness backstop), not by subject matching alone:
# `git diff fork/MiSTer-v6.18 origin/MiSTer-v6.18` over the non-vendored paths resolves to
# comment/style differences between two independent ports of the same features, plus exactly
# three behavioural deltas, all already dispositioned -- the spidev "altspi" compatible
# (record 246984fce; our DTS 0004 retargets the node to "rohm,dh2228fv", which vanilla spidev
# already accepts), vt.h MAX_NR_CONSOLES 63->9 (record b2a04cbfd), and the NSO Genesis
# hdev->product normalization (record b00a72159).
#
# READ THIS BEFORE TRUSTING THE [ok]: "dispositioned" is not "correct". The NSO Genesis delta
# in that list was dispositioned dropped-upstream by the original pass and turned out to be a
# real stock-parity gap -- vanilla has the DEVICE but not stock's Bluetooth PID normalization,
# and we had silently shipped without it since the 6.18 move. Found by tree-diffing our export
# against upstream's port, NOT by re-reading the record. Now carried as 0038 and the record is
# corrected to "carried". See docs/kernel-recon/fork-sync-2026-07.md §8.1.
#
# The general lesson, worth more than the fix: a record graded dropped-upstream with
# equivalence "partial" is a CARRY CANDIDATE, not a closed question -- the "partial" is where
# the regression hides.
#
# See docs/kernel-recon/fork-sync-2026-07.md for the full increment write-up.
MiSTer-v6.18  e8f065dbf8c567e8d7140142f72b9e2b1805d2dd
