# Configuration file for the input service

# This section contains options which are not specific to any
# particular interface
[General]

# Set idle timeout (in seconds) before the connection will be disconnect and
# the input device is removed.
# Defaults: 0 (disabled)
#IdleTimeout=0

# Enable HID protocol handling in userspace input profile
# Possible values:
#  - persist: Use UHID in persistent mode (keyboard only)
#  - true: Use UHID instead
#  - false: User kernel HIDP
# Defaults to true
#
# SET TO false DELIBERATELY. Until this file existed we ran BlueZ 5.79's
# compiled-in default of UHID_ENABLED (profiles/input/device.c:92), which is
# the OPPOSITE of stock -- stock's BlueZ 5.61 defaulted uhid_enabled = false,
# so MiSTer has always run kernel HIDP. Three reasons to go back to it:
#
#   1. bluetoothd leaves the per-report data path. Under uhid,
#      profiles/input/device.c:1258 puts intr_watch_cb() on the L2CAP
#      interrupt channel as a glib main-loop watch; it fires for EVERY input
#      report and copies it back into the kernel via uhid_send_input_report()
#      (device.c:386). A DualSense in full BT report mode is ~250 Hz, so that
#      is ~250 daemon wakeups/second/pad -- measurable as bluetoothd CPU.
#      With HIDP, ioctl_connadd() (device.c:919) hands both L2CAP sockets to
#      the kernel via HIDPCONNADD and bluetoothd is out of the data path,
#      only polling HIDPGETCONNINFO and tearing down with HIDPCONNDEL.
#
#   2. It matters more on the RT variant (docs/rt-beta-kernel.md). uhid puts
#      a SCHED_OTHER glib main loop in the input path, preemptible by any RT
#      task, so controller latency inherits bluetoothd's scheduling jitter --
#      and Main_MiSTer pins itself to CPU1 and spins, so bluetoothd contends
#      on CPU0. Kernel HIDP keeps the path in kernel context. NOTE this is a
#      mechanistic argument, NOT a measurement: the RT latency numbers are
#      still outstanding.
#
#   3. It repairs bt_auto_disconnect. Main_MiSTer identifies BT pads with
#      strstr(sysfs, "bluetooth") (input.cpp:4156), which never matches
#      uhid's /sys/devices/virtual/misc/uhid/... path. (The clean fix is
#      upstream -- input.cpp:5200 already reads bustype from EVIOCGID, so
#      bustype == BUS_BLUETOOTH would work on both transports -- but this
#      repo does not build Main_MiSTer, so this is the only lever we have.
#      MiSTer.ini ships bt_auto_disconnect=0, so nothing regresses today.)
#
# WHAT THIS DOES NOT COST US: Bluetooth LE. HIDP is BR/EDR-only, and
# profiles/input/hog.c:257-264 reads UserspaceHID *only* to test for the
# "persist" value -- it never disables uhid for LE. BLE HID devices keep
# using uhid regardless of this line. What we do give up is "persist" mode
# for BR/EDR (new in 5.79) and future BlueZ-side fixes to the BR/EDR HID
# path. Judged acceptable because our device quirks live in the hid-* kernel
# drivers, which BOTH paths share.
#
# SAFE BECAUSE CONFIG_BT_HIDP=y. Verified in the resolved kernel .config, not
# just board/mister/de10nano/linux.config (which is a minimal defconfig --
# an absent symbol there proves nothing). Without it this line would strand
# BR/EDR HID entirely. See docs/bluetooth-parity.md.
UserspaceHID=false

# Limit HID connections to bonded devices
# The HID Profile does not specify that devices must be bonded, however some
# platforms may want to make sure that input connections only come from bonded
# device connections. Several older mice have been known for not supporting
# pairing/encryption.
# Defaults to true for security.
#
# PINNED TO true ON PURPOSE -- do NOT "fix" DS3/SIXAXIS pairing by setting
# this false. It is already BlueZ 5.79's compiled-in default
# (profiles/input/device.c:93); pinning it explicitly is a guard, because
# this is exactly the line that every retro-gaming distro flips to false to
# make the PS3 pad work, and doing so drops the encryption requirement for
# EVERY BR/EDR HID device on the system, re-exposing CVE-2023-45866
# (unauthenticated HID injection).
#
# DS3 support is instead provided by the upstream CablePairing series
# backported in board/mister/de10nano/patches/bluez5_utils/ (BlueZ 5.83
# commits, carried because Buildroot 2026.05.1 pins 5.79). That makes the
# input server listen at BT_IO_SEC_LOW and re-raise security to
# BT_IO_SEC_MEDIUM for everything EXCEPT a device carrying the CablePairing
# property -- so the DS3 connects and every other pad keeps encryption.
# Upstream closed bluez#688 with that series, explicitly noting DS3 now works
# "without changing ClassicBondedOnly=false".
ClassicBondedOnly=true

# LE upgrade security
# Enables upgrades of security automatically if required.
# Defaults to true to maximize device compatibility.
#LEAutoSecurity=true
