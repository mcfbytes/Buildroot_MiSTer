################################################################################
#
# buildroot-build — prepare a GitHub-hosted runner and build the DE10-Nano image.
#
# Used by build.yml, release.yml and reproducibility.yml so the Buildroot recipe
# exists once. It is `make mister_de10nano_defconfig && make` with four caches
# around it:
#
#   1. the pinned Buildroot tarball      key: buildroot-tarball-<version>
#   2. dl/ (every package source)        key: br-dl-<version>-<sha of the defconfig, the userspace
#                                        profile and every package/*/*.hash>, so a package added by the
#                                        profile or a bumped pin re-saves the cache
#   3. output/host (the cross toolchain) key: br-host-<workspace>-<version>-<toolchain fingerprint>
#   4. ccache                            key: <version>, capped at 2Gi
#
# The repo's ceiling is 10 GB, LRU. Master's live set is ~8 GiB (dl/ ~3.4 +
# toolchain ~2.7 + ccache <= 2), so a SECOND generation of any one of them does
# not fit: saving it makes GitHub evict the least-recently-used entries, which
# are the ones this very run restored first -- the toolchain. So a master run
# with `prune-superseded: "true"` deletes the generation it supersedes BEFORE it
# saves the new one, and trims dl/ to this build's own sources. docs/ci.md#cache-supersede
#
# Two rules keep the caches honest. dl/ is saved only when `make external-deps`
# confirms every required file is present, because a cache key is immutable and
# an incomplete dl/ could never repair itself. The toolchain is restored only
# when dl/ was, and its key hashes the workspace path (a Buildroot toolchain
# bakes its absolute O= path in) plus the toolchain-relevant lines of the
# defconfig and any patches to gcc/binutils/glibc — a package added to the image
# does not move it, a compiler change does.
#
# Only master SAVES: PRs, tags and branch dispatches restore master's set read-only
# (a PR-scoped save is unreadable elsewhere and LRU-evicts master). docs/ci.md#cache-prune
#
################################################################################

name: Build the MiSTer image (Buildroot)
description: Prepare the runner (disk, apt, caches), then `make mister_de10nano_defconfig && make`.

inputs:
  extra-apt-packages:
    description: Space-separated apt packages on top of the build set (release.yml adds the 7z/genimage tools).
    required: false
    default: ""
  run-legal-info:
    description: Also run `make legal-info` (the SBOM) after the build. "true"/"false".
    required: false
    default: "false"
  prune-superseded:
    description: >-
      "true" on master: delete the master cache generations this run's saves supersede, just before
      saving. Needs `actions: write` on the calling job (build.yml grants it); other callers leave it off.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Free disk space on the runner
      shell: bash
      run: |
        echo "--- disk before ---"; df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/boost \
          /usr/local/graalvm || true
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        sudo apt-get clean || true
        echo "--- disk after ---"; df -h /

    - name: Resolve Buildroot version and the toolchain fingerprint
      shell: bash
      run: |
        set -eu
        # Same whitespace-tolerant read as renovate.json's matchString.
        ver=$(sed -n -e 's/[[:space:]]*$//' -e 's/^BUILDROOT_VERSION[[:space:]]*?=[[:space:]]*//p' Makefile | head -1)
        [ -n "$ver" ] || { echo "::error::could not read BUILDROOT_VERSION from Makefile" >&2; exit 1; }
        echo "BUILDROOT_VERSION=$ver" >> "$GITHUB_ENV"
        ws_fp=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)

        # Toolchain fingerprint: the defconfig minus package and kernel lines
        # (neither changes the compiler), plus any toolchain-source patches.
        sed -e 's/^[[:space:]]*#.*$//' -e 's/[[:space:]]\+#.*$//' -e 's/[[:space:]]*$//' \
          configs/mister_de10nano_defconfig \
          | grep -vE '^($|BR2_PACKAGE_|BR2_LINUX_KERNEL)' \
          | sort > .br-toolchain-fingerprint
        for d in gcc binutils glibc; do
          if [ -d "board/mister/de10nano/patches/$d" ]; then
            find "board/mister/de10nano/patches/$d" -type f -exec sha256sum {} + | sort >> .br-toolchain-fingerprint
          fi
        done
        echo "gen=1" >> .br-toolchain-fingerprint
        # If the arch line is not in the fingerprint the filter above is broken
        # and this key could restore the wrong compiler. Refuse rather than guess.
        grep -q '^BR2_arm=y' .br-toolchain-fingerprint || { echo "::error::toolchain fingerprint lost BR2_arm=y -- the filter in this action is stale" >&2; exit 1; }
        echo "Toolchain fingerprint ($(grep -c . .br-toolchain-fingerprint) lines):"; cat .br-toolchain-fingerprint
        tc_hash=$(sha256sum .br-toolchain-fingerprint | cut -d' ' -f1)
        echo "BR_HOST_KEY=br-host-${ws_fp}-${ver}-${tc_hash}" >> "$GITHUB_ENV"
        echo "Buildroot $ver, workspace $ws_fp, toolchain ${tc_hash:0:12}"

    - name: Restore Buildroot release tarball
      id: tarball-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: dl/buildroot-${{ env.BUILDROOT_VERSION }}.tar.gz
        key: buildroot-tarball-${{ env.BUILDROOT_VERSION }}

    - name: Restore dl/ download cache
      id: dl-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: dl/
        key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('configs/mister_de10nano_defconfig', 'package/mister-userspace/Config.in', 'package/*/*.hash') }}
        restore-keys: |
          br-dl-${{ env.BUILDROOT_VERSION }}-

    # Only with dl/ in place: a restored toolchain whose sources must then be
    # re-fetched anyway gains nothing and can mask a dl/ problem.
    - name: Restore host toolchain
      id: host-cache
      if: steps.dl-cache.outputs.cache-matched-key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          output/host
          output/build/host-*
        key: ${{ env.BR_HOST_KEY }}

    # 2Gi: one cold build stores ~1.8 GB (55k objects) and a warm one touches
    # fewer, so this holds a whole build with headroom. docs/ci.md#ccache-cap
    - name: Cache ccache
      id: ccache
      uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
      env:
        DEBIAN_FRONTEND: noninteractive
      with:
        key: ${{ env.BUILDROOT_VERSION }}
        max-size: 2Gi
        update-package-index: true
        save: ${{ github.ref == 'refs/heads/master' }}

    # The action writes max-size into ~/.config/ccache/ccache.conf, which
    # Buildroot's own ccache never reads (its build seds out the XDG/home paths
    # and reads only $BR_CACHE_DIR/ccache.conf). Without this the build's cap
    # is ccache's 5 GB default, and the cache grew ~1 GB per master build.
    - name: Cap the ccache that Buildroot's ccache reads
      shell: bash
      run: |
        set -eu
        export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
        mkdir -p "$CCACHE_DIR"
        ccache --set-config=max_size=2Gi
        grep -H '^max_size' "$CCACHE_DIR/ccache.conf"

    - name: Install build dependencies
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        EXTRA_APT: ${{ inputs.extra-apt-packages }}
      run: |
        set -eu
        sudo apt-get update
        # shellcheck disable=SC2086  # EXTRA_APT is a deliberate word list
        sudo -E apt-get install -y --no-install-recommends \
          build-essential bash bc bison flex gawk \
          git patch gzip bzip2 xz-utils cpio unzip rsync \
          file wget curl ca-certificates perl \
          python3 python3-dev \
          libssl-dev libncurses-dev pkg-config texinfo \
          qemu-user e2fsprogs \
          $EXTRA_APT
        sudo rm -rf /var/lib/apt/lists/*

    - name: Verify host `install` is GNU coreutils
      shell: bash
      run: make hostshim

    - name: Configure
      shell: bash
      run: make mister_de10nano_defconfig

    - name: Build
      id: build
      shell: bash
      run: make BR2_CCACHE=y BR2_CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" BR2_CCACHE_USE_BASEDIR=y

    - name: Generate legal-info (SBOM)
      id: legal-info
      if: inputs.run-legal-info == 'true'
      shell: bash
      run: make legal-info BR2_CCACHE=y BR2_CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" BR2_CCACHE_USE_BASEDIR=y

    - name: Check dl/ is complete before caching it
      id: dl-state
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        if ! make external-deps 2>/dev/null | grep -vE '/|=|^\s*$| |^#' | sort -u > /tmp/dl-needed.txt; then
          echo "complete=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=dl/ not cached::make external-deps failed, so dl/ completeness is unknown and it was not saved."
          exit 0
        fi
        find dl -type f -printf '%f\n' 2>/dev/null | sort -u > /tmp/dl-have.txt
        comm -23 /tmp/dl-needed.txt /tmp/dl-have.txt > /tmp/dl-missing.txt || true
        missing=$(wc -l < /tmp/dl-missing.txt)
        echo "dl/ needs $(wc -l < /tmp/dl-needed.txt) files, $missing missing, $(du -sh dl 2>/dev/null | cut -f1) on disk"
        if [ "$missing" -eq 0 ]; then
          echo "complete=true" >> "$GITHUB_OUTPUT"
        else
          echo "complete=false" >> "$GITHUB_OUTPUT"
          echo "--- missing ---"; cat /tmp/dl-missing.txt
          echo "::notice title=dl/ not cached::dl/ is missing $missing required files (a build that failed early); not saved."
        fi
        if [ -f "dl/buildroot-${BUILDROOT_VERSION}.tar.gz" ]; then
          echo "tarball=true" >> "$GITHUB_OUTPUT"
        else
          echo "tarball=false" >> "$GITHUB_OUTPUT"
        fi

    # restore-keys hydrates dl/ from an OLDER generation, so without this every
    # bumped package's previous tarball rode along forever (5.2 GB on disk vs
    # 4.5 GB needed on 2026-11-11). Only regular files directly under dl/<pkg>/
    # go; the Buildroot tarball (dl/ itself) and dl/<pkg>/git/ clones stay.
    - name: Trim dl/ to this build's sources before caching it
      if: always() && github.ref == 'refs/heads/master' && steps.dl-cache.outputs.cache-hit != 'true' && steps.dl-state.outputs.complete == 'true'
      shell: bash
      run: |
        set -euo pipefail
        before=$(du -sm dl | cut -f1)
        find dl -mindepth 2 -maxdepth 2 -type f -printf '%P\n' | sort > /tmp/dl-files.txt
        removed=0
        while IFS= read -r rel; do
          if ! grep -qxF -- "${rel##*/}" /tmp/dl-needed.txt; then
            rm -f -- "dl/$rel"
            removed=$((removed + 1))
            echo "trimmed dl/$rel"
          fi
        done < /tmp/dl-files.txt
        echo "dl/ trimmed: $removed stale file(s), ${before} MiB -> $(du -sm dl | cut -f1) MiB"

    # Each save below writes a new immutable key while the generation it replaces
    # is still live, and LRU then evicts what this run restored first (the
    # toolchain). Delete the superseded generation first. Each flag mirrors its
    # save step's condition; nothing outside refs/heads/master and the three key
    # shapes is touched, and every failure here is a warning, never a red build.
    # docs/ci.md#cache-supersede
    - name: Delete the master cache generations this run supersedes
      if: always() && inputs.prune-superseded == 'true' && github.ref == 'refs/heads/master'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_OK: ${{ steps.build.outcome == 'success' && (steps.legal-info.outcome == 'success' || steps.legal-info.outcome == 'skipped') }}
        DL_HIT: ${{ steps.dl-cache.outputs.cache-hit }}
        DL_COMPLETE: ${{ steps.dl-state.outputs.complete }}
        DL_KEY: ${{ steps.dl-cache.outputs.cache-primary-key }}
        HOST_HIT: ${{ steps.host-cache.outputs.cache-hit }}
        CCACHE_OUTCOME: ${{ steps.ccache.outcome }}
      run: |
        set -uo pipefail
        api="repos/$GITHUB_REPOSITORY/actions/caches"
        ref=refs/heads/master

        # $1 server-side key prefix, $2 ERE the returned key must match, $3 key to keep.
        prune() {
          local prefix=$1 pattern=$2 keep=$3 id got_ref size key
          if ! gh api --method GET --paginate "$api" -f "ref=$ref" -f "key=$prefix" \
               -q '.actions_caches[] | "\(.id)\t\(.ref)\t\(.size_in_bytes)\t\(.key)"' \
               </dev/null > /tmp/supersede.txt; then
            echo "::warning title=cache supersede::could not list ${prefix}* on master; not pruned"
            return 0
          fi
          while IFS=$'\t' read -r id got_ref size key; do
            [ -n "$id" ] || continue
            # Response-side guard, as in cache-prune.yml: trust what came back, not what was asked.
            if [ "$got_ref" != "$ref" ] || ! [[ "$key" =~ $pattern ]]; then
              echo "::warning title=cache supersede::refusing cache $id ($key) on '$got_ref'"
              continue
            fi
            [ "$key" != "$keep" ] || continue
            case "${size:-}" in ''|*[!0-9]*) size=0 ;; esac
            if gh api --silent -X DELETE "$api/$id" </dev/null; then
              echo "deleted superseded $key ($((size / 1048576)) MiB)"
            else
              echo "::warning title=cache supersede::could not delete cache $id ($key)"
            fi
          done < /tmp/supersede.txt
        }

        if [ "$DL_HIT" != "true" ] && [ "$DL_COMPLETE" = "true" ]; then
          prune br-dl- '^br-dl-[0-9]{4}\.[0-9]{2}(\.[0-9]+)?-[0-9a-f]{64}$' "$DL_KEY"
        fi
        if [ "$BUILD_OK" = "true" ] && [ "$HOST_HIT" != "true" ]; then
          prune br-host- '^br-host-[0-9a-f]{8}-' "$BR_HOST_KEY"
        fi
        # The ccache post step saves a fresh ccache-<version>-<timestamp> after
        # this; on a red build it still saves, but the older generation is kept
        # and cache-prune.yml removes it afterwards.
        if [ "$BUILD_OK" = "true" ] && [ "$CCACHE_OUTCOME" = "success" ]; then
          prune ccache- '^ccache-' ""
        fi
        exit 0

    - name: Save dl/ download cache
      if: always() && github.ref == 'refs/heads/master' && steps.dl-cache.outputs.cache-hit != 'true' && steps.dl-state.outputs.complete == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: dl/
        key: ${{ steps.dl-cache.outputs.cache-primary-key }}

    - name: Save Buildroot release tarball
      if: always() && github.ref == 'refs/heads/master' && steps.tarball-cache.outputs.cache-hit != 'true' && steps.dl-state.outputs.tarball == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: dl/buildroot-${{ env.BUILDROOT_VERSION }}.tar.gz
        key: ${{ steps.tarball-cache.outputs.cache-primary-key }}

    - name: Save host toolchain
      if: github.ref == 'refs/heads/master' && steps.host-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          output/host
          output/build/host-*
        key: ${{ env.BR_HOST_KEY }}

    - name: Report disk and cache usage
      if: always()
      shell: bash
      run: |
        echo "--- disk free ---"; df -h .
        echo "--- dl/ ---"; du -sh dl 2>/dev/null || true
        echo "--- output/host ---"; du -sh output/host 2>/dev/null || true
        echo "--- output ---"; du -sh output 2>/dev/null || true
        echo "--- ccache ---"; du -sh "$GITHUB_WORKSPACE/.ccache" 2>/dev/null || true
