# Keep memory compaction off locked pages. A SCHED_FIFO thread in an mlockall()'d main binary takes a
# minor fault, and stalls, for each of its pages compaction migrates. Measured 2026-10-05 on a DE10-Nano,
# 6.18.55, under forced compaction (rig note kstall-sysctl-2026-10-05-measured.md): one 21 ms stall and
# a TAS-replay desync in four runs, 6 faults on that thread. With these two values: none in four,
# 0 faults, while compaction still migrated 64-90k pages a run.
# PREEMPT_RT kernels already default compact_unevictable_allowed to 0 for this reason.
# Revert: vm.compact_unevictable_allowed = 1 and vm.compaction_proactiveness = 20 in
# /media/fat/linux/sysctl.conf (docs/user/faq.md), which is applied after this file.
vm.compact_unevictable_allowed = 0
vm.compaction_proactiveness = 0
