% minijail-config-file v0

# bluetoothd's jail, used by /usr/bin/bluetoothd through /usr/lib/mister/jail.sh.
# Why each line: docs/bluetooth-parity.md §11.

# uid/gid 8423 (users.table); CAP_NET_BIND_SERVICE | CAP_NET_ADMIN.
u = 8423
g = 8423
c = 0x1400

# Mount, PID (bluetoothd is init) and IPC namespaces. No network or UTS one.
ns-mount
I
l

R = RLIMIT_RTPRIO,0,0

bind-mount = /usr
bind-mount = /etc/bluetooth
bind-mount = /etc/passwd
bind-mount = /etc/group
mount = proc,/proc,proc,MS_RDONLY|MS_NOSUID|MS_NODEV|MS_NOEXEC
bind-mount = /sys
mount = /dev,/dev,none,MS_BIND
mount = /dev,/dev,none,MS_BIND|MS_REMOUNT|MS_RDONLY|MS_NOSUID|MS_NOEXEC
mount = /run/bluetoothd/run,/run,none,MS_BIND
mount = /run,/run,none,MS_BIND|MS_REMOUNT|MS_NOEXEC|MS_NOSUID|MS_NODEV
bind-mount = /run/dbus
bind-mount = /run/udev
# /dev/log is a link into it (S01syslogd).
bind-mount = /run/log
mount = /var/lib/bluetooth,/var/lib/bluetooth,none,MS_BIND
mount = /var/lib/bluetooth,/var/lib/bluetooth,none,MS_BIND|MS_REMOUNT|MS_NOEXEC|MS_NOSUID|MS_NODEV
mount = tmpfs,/tmp,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC,size=64k

fs-path-rx = /usr
fs-path-ro = /etc
fs-path-ro = /proc
fs-path-ro = /sys
fs-path-rw = /dev
fs-path-advanced-rw = /run
fs-path-advanced-rw = /var/lib/bluetooth
