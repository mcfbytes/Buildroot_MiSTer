% minijail-config-file v0

# gpm's jail, used by /usr/libexec/mister/gpm-jail through /usr/lib/mister/jail.sh.
# Why each line: docs/minijail.md "gpm".

# uid/gid 8427 (users.table); CAP_SYS_ADMIN only: TIOCLINUX from a process without the
# console as its controlling tty needs it, even to draw the pointer.
u = 8427
g = 8427
c = 0x200000

# Mount, PID, IPC and network namespaces: /dev/gpmctl is a path socket.
ns-mount
I
l
e

bind-mount = /usr
# Its own /dev: private tty0, mice and null nodes, the gpmctl socket it makes, a log link.
mount = /dev/gpm,/dev,none,MS_BIND
mount = /dev/gpm,/dev,none,MS_BIND|MS_REMOUNT|MS_NOEXEC|MS_NOSUID
bind-mount = /run/log
# Writable by its modes, granted by no Landlock rule: the start's Landlock probe.
mount = tmpfs,/var/empty,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC,mode=1777,size=4k

fs-path-rx = /usr
fs-path-ro = /etc
fs-path-ro = /run/log
fs-path-advanced-rw = /dev
fs-path-advanced-rw = /var/run
