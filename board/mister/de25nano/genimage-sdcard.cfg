# genimage config for the DE25-Nano SD card -- produces images/sdcard-de25.img
# (D2.4; docs/de25-nano-tasks.md, ADR 0029 D3/D4).
#
# The rationale, the layout table and the write-the-card procedure live in
# docs/de25-sdcard.md. This file states the layout and cites; it deliberately
# does NOT re-derive the boot chain the way the DE10's sibling file has to.
#
# Read board/mister/de10nano/genimage-sdcard.cfg only as a CONTRAST. That card
# is built around the Cyclone V BootROM's raw 0xA2 partition scan; this one is
# built around a completely different mechanism, and almost none of its lore
# transfers (docs/de25-readiness-ledger.md coupling (b)).
#
# ---------------------------------------------------------------------------
# The three facts this layout is made of
# ---------------------------------------------------------------------------
#
# 1. The factory U-Boot SPL -- which lives in QSPI and which NOTHING WE SHIP
#    EVER WRITES (ADR 0029 D4) -- loads `u-boot.itb` BY NAME from a FAT
#    filesystem on partition 1: CONFIG_SPL_FS_FAT=y plus
#    SYS_MMCSD_FS_BOOT_PARTITION defaulting to 1, with the FIT landing at
#    CONFIG_SPL_LOAD_FIT_ADDRESS=0x82000000
#    (docs/de25-boot-chain.md §2 step 4, §8.3). So: partition 1 is FAT, is
#    partition-table ENTRY 1, and holds a file called exactly `u-boot.itb`.
#    Those three are the entire interface we own to the board's boot firmware.
#
# 2. THERE IS NO 0xA2 PARTITION HERE, and adding one would be cargo cult.
#    The 0xA2 type byte is the *Cyclone V BootROM's* raw-partition contract
#    (de10nano/genimage-sdcard.cfg header, docs/boot-chain.md §2.1). On Agilex
#    5 the SDM boots the SPL out of QSPI and the SPL then reads a *filesystem*
#    -- "No 0xA2 analogue [V]", docs/de25-boot-chain.md §2. There is no raw
#    region on this card at all. scripts/check-sdcard-de25.sh fails the image
#    if a 0xA2 partition, or a third partition, ever appears.
#
# 3. NOTHING ON THIS CARD MAY REFERENCE QSPI. Not the FAT payload, not
#    extlinux.conf, not a U-Boot script. The QSPI holds the SDM firmware, the
#    phase-1 bitstream and the FSBL; a write to it is brick-class with
#    JTAG-and-a-PC recovery and no RSU safety net
#    (docs/de25-boot-chain.md §6, §7 rows 1/5/10/11/12). The checker greps
#    extlinux.conf for `sf probe`, `ubi` and `mtd` and fails on any hit.
#
# ---------------------------------------------------------------------------
# Inputs, all read from genimage's --inputpath (= Buildroot's BINARIES_DIR)
# ---------------------------------------------------------------------------
#   u-boot.itb                     FIT: ATF BL31 + U-Boot proper + U-Boot DTB.
#                                  Built by D2.2's BR2_TARGET_UBOOT; the ONLY
#                                  file the factory SPL looks for.
#   Image                          aarch64 kernel, uncompressed
#                                  (BR2_LINUX_KERNEL_IMAGE=y).
#   socfpga_agilex5_de25nano.dtb   our board DTB
#                                  (BR2_LINUX_KERNEL_CUSTOM_DTS_PATH).
#   extlinux/                      staged by board/mister/de25nano/post-image.sh,
#                                  which generates extlinux.conf from a
#                                  template so the kernel/DTB names and the
#                                  bootargs have exactly one author.
#   rootfs.ext4                    BR2_TARGET_ROOTFS_EXT2 + _EXT2_4, written to
#                                  p2 verbatim.
#
# post-image.sh is what actually runs genimage (via Buildroot's own
# support/scripts/genimage.sh); it fails loudly if any of the above is missing.

# Partition 1's filesystem, built separately so its size is ours to choose and
# so `-F 32` can be forced -- see the size and extraargs notes below.
image boot-de25.vfat {
	vfat {
		# The FAT volume label. It is what the card identifies itself as to
		# a human with a card reader, and scripts/check-sdcard-de25.sh pins
		# it: an unlabelled or differently-labelled p1 is how you find out
		# you wrote the DE10's card, or someone else's, into this slot.
		label = "DE25BOOT"

		# `-F 32` is NOT optional and NOT cosmetic. mkfs.vfat picks the FAT
		# width from the volume size, and at 256 MiB it picks FAT16 -- which
		# would leave the partition-type byte below (0x0c = "FAT32 LBA")
		# lying about the filesystem inside it. The DE10's mk-sdcard.sh
		# forces the same flag for the same reason.
		extraargs = "-F 32"

		# The last entry, `extlinux`, is a DIRECTORY, copied recursively
		# (genimage hands each entry to mcopy; Buildroot's own
		# board/uevm5432 and board/beagleboard/* genimage.cfgs list
		# `extlinux` exactly this way). It contains one file,
		# extlinux/extlinux.conf, generated by post-image.sh.
		#
		# Note for editors: genimage's parser does not accept comments
		# INSIDE a `files = { ... }` list -- it reports them as an
		# unexpected token. Annotate above the list, as here.
		files = {
			"u-boot.itb",
			"Image",
			"socfpga_agilex5_de25nano.dtb",
			"extlinux"
		}
	}

	# 256 MiB. Sized for room, not for fit: the payload today is ~42 MiB of
	# kernel plus a DTB, a FIT and a text file. The slack is there because
	# this partition is where a `core.rbf`, a `uboot.env` and any future
	# boot-time fabric bitstream have to go -- all of them FAT-resident by
	# the same §2/§3 argument that puts u-boot.itb here -- and because
	# growing p1 later means re-writing every card, while wasting 200 MiB of
	# a microSD costs nothing.
	#
	# Also a FAT32 floor: below ~32 MiB (at 512 B/cluster) mkfs.vfat cannot
	# make a conforming FAT32 at all, so "256 MiB" and "-F 32" back each
	# other up.
	size = 256M
}

image sdcard-de25.img {
	hdimage {
		# 1 MiB partition alignment: the universal removable-media
		# convention, what sfdisk lays down by default, and what keeps the
		# FAT32 BPB's hidden-sectors field agreeing with the real partition
		# start. Same reasoning as the DE10 file's `align = 1M`.
		align = 1M

		# ------------------------------------------------------------------
		# MBR, NOT GPT -- and this is a fail-closed choice, not a preference.
		# ------------------------------------------------------------------
		# The only reader that matters is Terasic's FACTORY U-Boot SPL, and
		# the question is which partition drivers it was compiled with
		# (SPL_DOS_PARTITION vs SPL_EFI_PARTITION). What the dossier records:
		#
		#  * docs/de25-boot-chain.md §8.3 enumerates the SPL's compiled-in
		#    contract from the mainline agilex5 defconfig -- SPL_LOAD_FIT,
		#    SPL_LOAD_FIT_ADDRESS=0x82000000, SPL_FS_FAT,
		#    SYS_MMCSD_FS_BOOT_PARTITION=1, SPL_FIT_SIGNATURE, ENV_IS_IN_FAT
		#    -- and NO partition-table symbol appears anywhere in it, in
		#    either direction. GPT is therefore unproven, not disproven, and
		#    the factory SPL's own binary has never been read for it (the
		#    published SPL was only carved for its DTB, §8.2).
		#
		#  * The one positive datum anyone has is MBR: a physical
		#    DE25-Nano has been observed booting from an MBR-partitioned card
		#    -- "Single active MBR partition, exFAT, spanning the card",
		#    docs/de25-reference-implementation.md:572 -- under an SPL built
		#    from the same U-Boot 2025.01 vendor tree the factory SPL comes
		#    from (:212, both identify as 2025.01, vendor=terasic).
		#
		# Two partitions need nothing GPT offers. So: take the option that
		# has evidence behind it. If an SPL readback (boot-chain §5) ever
		# proves SPL_EFI_PARTITION is compiled in, this becomes a one-line
		# change -- and it is a change that must be re-tested on hardware,
		# never waved through at a desk.
		partition-table-type = "mbr"

		# `disk-signature` is deliberately NOT set. Left alone, genimage
		# writes 0x00000000 at MBR offset 440 -- deterministic, which is what
		# BR2_REPRODUCIBLE=y in configs/mister_de25nano_defconfig wants.
		# Setting it to `random` would make every build's image differ in
		# four bytes for no functional gain (nothing on this board keys off
		# the MBR disk signature).
	}

	# --- p1 / /dev/mmcblk0p1 -------------------------------------------------
	# MUST be table entry 1: SYS_MMCSD_FS_BOOT_PARTITION=1 addresses the MBR
	# ENTRY, not an on-disk order. genimage assigns entry numbers strictly in
	# the order the `partition` sections are declared here, so `boot` first.
	#
	# 0x0c = FAT32 with LBA addressing. `bootable` is set because U-Boot's
	# distro/bootstd scan prefers the active partition and it costs nothing;
	# it is NOT load-bearing for the SPL, which keys on the partition number.
	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot-de25.vfat"
	}

	# --- p2 / /dev/mmcblk0p2 -------------------------------------------------
	# The ext4 rootfs, written verbatim; the kernel mounts it directly via
	# `root=/dev/mmcblk0p2` in extlinux.conf. No loop-mounted linux.img, no
	# initramfs, no installer -- the DE25 developer OS has none of the DE10's
	# machinery (configs/mister_de25nano_defconfig, "NO STAGE-1 INITRAMFS").
	#
	# INTERIM DECISION, recorded as interim: ADR 0029 D3 fixes the partition
	# COUNT and p1's FAT type only; p2's filesystem is explicitly still an
	# owner decision (docs/de25-implementation-path.md §6.3, §8 Q7). For this
	# developer-OS card p2 is the plain ext4 rootfs Buildroot already builds.
	# Revisit when the card grows a user-visible data volume -- see
	# docs/de25-sdcard.md "The interim p2 decision".
	#
	# 0x83 = Linux. No `size =`: genimage takes it from rootfs.ext4's own size
	# (BR2_TARGET_ROOTFS_EXT2_SIZE), so the card grows when the rootfs does
	# and there is no second number to keep in sync.
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
