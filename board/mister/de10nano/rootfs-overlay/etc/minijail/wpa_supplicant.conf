% minijail-config-file v0

# wpa_supplicant's jail, one per interface, used by /usr/libexec/mister/wpa-jail
# through /usr/lib/mister/jail.sh. Why each line: docs/wifi-parity.md §15.

# uid/gid 8426 (users.table); CAP_NET_ADMIN | CAP_NET_RAW. wpa_cli gives its reply
# socket to group wpa (patches/wpa_supplicant/0001).
u = 8426
g = 8426
c = 0x3000

# Mount, PID and IPC namespaces; it manages the host's interfaces, so no network one.
ns-mount
I
l

bind-mount = /usr
bind-mount = /etc/ssl
mount = /dev/null,/dev/null,none,MS_BIND
mount = /dev/urandom,/dev/urandom,none,MS_BIND
mount = /dev/random,/dev/random,none,MS_BIND
mount = proc,/proc,proc,MS_RDONLY|MS_NOSUID|MS_NODEV|MS_NOEXEC
# Per-interface sysctls it sets on association (drop_unicast_in_l2_multicast, ...).
bind-mount = /proc/sys/net,/proc/sys/net,1
bind-mount = /sys
# The directory, not the file: wifi.sh replaces wpa_supplicant.conf by rename.
bind-mount = /media/fat/linux
mount = /run/wpa_supplicant,/run/wpa_supplicant,none,MS_BIND
mount = /run/wpa_supplicant,/run/wpa_supplicant,none,MS_BIND|MS_REMOUNT|MS_NOEXEC|MS_NOSUID|MS_NODEV
bind-mount = /run/log
# Read-only: only to reach wpa_cli's reply sockets.
bind-mount = /tmp
# Writable by its modes, granted by no Landlock rule: the start's Landlock probe.
mount = tmpfs,/var/empty,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC,mode=1777,size=4k

fs-path-rx = /usr
fs-path-ro = /etc
fs-path-ro = /proc
fs-path-rw = /proc/sys/net
fs-path-ro = /sys
fs-path-rw = /dev/null
fs-path-ro = /dev/urandom
fs-path-ro = /dev/random
fs-path-ro = /media/fat/linux
fs-path-advanced-rw = /run/wpa_supplicant
