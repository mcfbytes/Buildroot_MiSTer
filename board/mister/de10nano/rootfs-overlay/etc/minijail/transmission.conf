% minijail-config-file v0

# transmission-daemon's jail, used by /etc/init.d/S92transmission through
# /usr/lib/mister/jail.sh. Why each line: docs/bittorrent.md §8.1.

# uid/gid 8422 (users.table); CAP_DAC_OVERRIDE only, since exFAT has no modes.
u = 8422
g = 8422
c = 0x2

ns-mount
I
l
uts

bind-mount = /usr
bind-mount = /etc/passwd
bind-mount = /etc/group
bind-mount = /etc/hosts
bind-mount = /etc/nsswitch.conf
bind-mount = /etc/ssl
bind-mount = /run/resolv.conf,/etc/resolv.conf
mount = proc,/proc,proc,MS_RDONLY|MS_NOSUID|MS_NODEV|MS_NOEXEC
mount-dev
mount = tmpfs,/tmp,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC,size=16m
# The state one level down, bound back at the path the daemon was configured with.
mount = /media/fat/linux/transmission/jail,/media/fat/linux/transmission,none,MS_BIND
mount = /media/fat/linux/transmission,/media/fat/linux/transmission,none,MS_BIND|MS_REMOUNT|MS_NOEXEC|MS_NOSUID|MS_NODEV

fs-path-rx = /usr
fs-path-ro = /etc
fs-path-ro = /proc
fs-path-rw = /dev
fs-path-rw = /tmp
fs-path-advanced-rw = /media/fat/linux/transmission
