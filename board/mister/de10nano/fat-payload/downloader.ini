; Downloader_MiSTer configuration
; Shipped by MiSTer Linux Modernization -- https://github.com/mcfbytes/Buildroot_MiSTer
;
; This is an ordinary downloader.ini. Every setting in it is a normal, supported
; Downloader option, and Update All understands all of it. Edit it freely.
;
; ---------------------------------------------------------------------------
; NOTE ON COMMENTS
; ---------------------------------------------------------------------------
; Update All preserves the text ABOVE the first section and the whole [MiSTer]
; section verbatim, but re-emits the database sections through a plain ini
; writer, which drops comments attached to them. Keep explanations up here or
; inside [MiSTer]; anything written below the first database header is lost the
; first time Update All rewrites this file.
;
; ---------------------------------------------------------------------------
; WHY update_linux = false
; ---------------------------------------------------------------------------
; The Downloader applies AT MOST ONE Linux image per run. The official
; distribution_mister database always carries one, and when several configured
; databases carry a `linux` entry the Downloader picks whichever appears FIRST
; in this file's database order. Update All pins [distribution_mister] to the
; top whenever it rewrites this file, so the official image would always win --
; and a routine core update would silently replace this project's kernel and
; root filesystem with the stock one.
;
; `update_linux = false` switches the Linux update off for EVERY normal run, so
; no database's `linux` entry is even looked at. That removes the contest
; entirely instead of trying to win it.
;
; NOTHING ELSE IS DISABLED. Cores, ROMs, MRAs, Jotego, Coin-Op, wallpapers and
; everything else update exactly as they would on a stock card.
;
; Only `false`, `no`, `n`, `f`, `off` and `0` mean false here, and only `true`,
; `yes`, `y`, `t`, `on` and `1` mean true. ANY other value makes EVERY
; Downloader run fail with a traceback -- so if you edit this line, use one of
; those words.
;
; To update THIS project's Linux image, run, from the MiSTer OSD:
;
;     Scripts  >  update_linux_modernization
;
; That script re-enables the Linux update for one run and one database, using
; its own private configuration. It does not depend on this file.
;
; ---------------------------------------------------------------------------
; GOING BACK TO THE OFFICIAL LINUX IMAGE
; ---------------------------------------------------------------------------
; Run `Scripts/update_linux_modernization.sh --restore-stock`, or fetch
; uninstall.sh from the repository. By hand it is one edit: set
; `update_linux = true` below and run a normal update. Nothing re-applies the
; setting behind you -- that script is the only thing that ever writes it, and
; it only runs when you run it. See docs/user/rollback.md.

[MiSTer]
update_linux = false

; ---------------------------------------------------------------------------
; Databases
; ---------------------------------------------------------------------------
; This is the same default set Update All creates on a card that has no
; downloader.ini at all. It is written out explicitly because the mere presence
; of this file stops Update All from creating those defaults -- without these
; sections a freshly flashed card would end up with FEWER cores than a stock
; one. Update All rewrites every db_url below to its own canonical value on
; every run, so these URLs cannot go stale.
;
; Deleting [distribution_mister] does NOT fall back to the official database:
; the Downloader only auto-adds it when the base ini declares no databases at
; all. Removing it here silently stops your main cores from updating.
;
; `filter = !jtbeta` excludes Jotego's Patreon-only beta cores, which need a
; jtbeta.zip key on the card to run at all. This matches what Update All
; configures for a user who has not enabled beta cores; enabling them in Update
; All rewrites this filter for you.

[distribution_mister]
db_url = https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/db.json.zip

[jtcores]
db_url = https://raw.githubusercontent.com/jotego/jtcores_mister/main/jtbindb.json.zip
filter = !jtbeta

[Coin-OpCollection/Distribution-MiSTerFPGA]
db_url = https://raw.githubusercontent.com/Coin-OpCollection/Distribution-MiSTerFPGA/db/db.json.zip

[update_all_mister]
db_url = https://raw.githubusercontent.com/theypsilon/Update_All_MiSTer/db/update_all_db.json
