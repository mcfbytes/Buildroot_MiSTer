; Downloader_MiSTer configuration -- shipped by MiSTer Linux Modernization.
; https://github.com/mcfbytes/Buildroot_MiSTer
;
; This is an ordinary downloader.ini. Everything in it is a normal, supported
; setting, and Update All understands all of it. Edit it freely.
;
; NOTE ON COMMENTS: Update All rewrites this file the first time it runs (to add
; its own [update_all_mister] database). It preserves everything ABOVE and
; INSIDE the [MiSTer] section verbatim -- which is why all of the explanation
; lives up here -- but it re-emits the database sections through a plain ini
; writer, which drops comments attached to them. So do not put anything you want
; to keep below the first [ ... ] database header.
;
; ---------------------------------------------------------------------------
; update_linux = false -- the one setting that is ours
; ---------------------------------------------------------------------------
; This stops EVERY normal Downloader run -- `update_all.sh` and
; `Scripts/update.sh` alike -- from applying a Linux image. That is what keeps
; the official image from overwriting this project's kernel and rootfs.
;
; It is needed because the Downloader applies AT MOST ONE Linux update per run,
; and when several configured databases carry a `linux` entry it takes whichever
; one finished downloading and parsing FIRST -- a race between worker threads,
; not something you can prioritise. Left to chance, a routine core update
; silently reverts you to the stock image. Turning the Linux update off for
; normal runs removes the race entirely.
;
; Nothing else is disabled. Cores, ROMs, MRAs and everything else update exactly
; as they would on a stock card.
;
; To update THIS project's Linux image, run:
;
;     Scripts/update_linux_modernization.sh
;
; It re-enables the Linux update for that one run, for that one database.
;
; To go back to the stock Linux image: set update_linux = true (or delete the
; line) and run a normal update -- the official image installs over ours on the
; next run. See docs/user/rollback.md for the full procedure.
;
; ---------------------------------------------------------------------------
; The database sections below
; ---------------------------------------------------------------------------
; [distribution_mister]
;     The official MiSTer distribution: cores, menu, MRAs, firmware. Every
;     MiSTer has this one, whether or not it is written down anywhere.
;
;     IMPORTANT if you edit this file: the Downloader only auto-adds this
;     database when the base ini declares NO databases at all (config_reader.py,
;     _add_default_database). Because this file declares some, it has to declare
;     this one too. Deleting the [distribution_mister] section does NOT fall
;     back to the default -- it silently stops your main cores from updating.
;
; [jtcores]
;     Jotego's cores. A large part of the MiSTer arcade ecosystem, and not part
;     of the official distribution, so a stock card does not get them until the
;     user turns them on in Update All. Enabled here so a freshly flashed card
;     has them from the start.
;
;     `filter = !jtbeta` excludes the Patreon-only beta cores, which need a
;     `jtbeta.zip` key on the card to be usable at all. This matches what Update
;     All configures for a user who has not enabled beta cores. If you later
;     enable beta cores in Update All, it rewrites this filter for you.

[MiSTer]
update_linux = false

[distribution_mister]
db_url = https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/db.json.zip

[jtcores]
db_url = https://raw.githubusercontent.com/jotego/jtcores_mister/main/jtbindb.json.zip
filter = !jtbeta
