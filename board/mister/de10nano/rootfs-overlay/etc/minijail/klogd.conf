% minijail-config-file v0

# BusyBox klogd's jail, used by /etc/init.d/S02klogd through
# /usr/lib/mister/jail.sh. Why each line: docs/minijail.md "syslogd and klogd".

# uid/gid 8425 (users.table); CAP_SYSLOG only, to read the kernel log with klogctl().
u = 8425
g = 8425
c = 0x400000000

# Mount, PID, IPC and network namespaces.
ns-mount
I
l
e

bind-mount = /usr
mount = /dev/null,/dev/null,none,MS_BIND
# Connects to /dev/log, a link into syslogd's directory.
bind-mount = /run/log
# Writable by its modes, granted by no Landlock rule: the start's Landlock probe.
mount = tmpfs,/var/empty,tmpfs,MS_NOSUID|MS_NODEV|MS_NOEXEC,mode=1777,size=4k

fs-path-rx = /usr
fs-path-ro = /etc
fs-path-rw = /dev/null
fs-path-ro = /run/log
